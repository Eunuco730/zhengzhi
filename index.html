 深刻把握实现“十五五”时期目标任务对把权力关进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>笼子提出的更高要求，坚定不移强化制度治权、依规用权；", "ans": "制度"}, {"id": 446, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[446]</span> 第一，强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>监督，推动全党凝心聚力实现“十五五”时期目标任务。", "ans": "政治"}, {"id": 447, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[447]</span> 第二，强化正风肃纪，巩固拓展深入贯彻中央八项规定精神学习教育成果。持续狠刹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">享乐</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">奢靡</span></span>之风，对违规吃喝、违规收送礼品礼金等易发多发问题深化整治；对以调研考察、开展党建活动、培训的名义搞公款旅游，变相公款出国（境）旅游等问题严肃查处；对借民生项目违规建设楼堂馆所等新动向密切关注并纠治。持续整治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">形式</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">官僚</span></span>主义，坚决纠治临近换届等待观望不作为，换届后急功近利“翻烧饼”、搞“政绩工程”等突出问题，推动为基层减负。", "ans": "享乐, 奢靡, 形式, 官僚"}, {"id": 448, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[448]</span> 第三，强化标本兼治，用好一体推进不敢腐、不能腐、不想腐战略抓手。以保持高压震慑强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不敢</span></span>腐，坚持猛药去疴、重典治乱。以加强监督制约强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不能</span></span>腐，健全授权用权制权相统一、清晰透明可追溯的制度机制。以深化廉洁教育强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不想</span></span>腐，不断塑造清正廉洁的思想品格、廉洁奉公的政德修养、廉洁自律的道德操守、崇廉拒腐的社会风尚。以完善体制机制促进一体推进，健全党委统一领导下的反腐败工作机制。", "ans": "不敢, 不能, 不想"}, {"id": 449, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[449]</span> 第四，强化执纪执法为民，持续深化群众身边不正之风和腐败问题集中整治。推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">县</span></span>级主战场持续深化整治工作，发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">群众</span></span>监督作用，提升基层监督能力。", "ans": "县, 群众"}, {"id": 450, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[450]</span> 第五，强化政治巡视，增强巡视监督震慑力、穿透力、推动力。深化巡视巡察上下联动，加强对省区市<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、中央单位内部<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、对村<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡察</span></span>工作指导督导。第六，强化铁军意识，不断提高纪检监察工作规范化法治化正规化水平。", "ans": "巡视, 巡视, 巡察"}, {"id": 451, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[451]</span> 党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党、怎样建设长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。", "ans": "执政, 马克思主义, 执政, 马克思主义"}, {"id": 452, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[452]</span> 必须坚持投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物</span></span>和投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>紧密结合。", "ans": "物, 人"}, {"id": 453, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[453]</span> 一是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，建设强大国内市场；", "ans": "内需"}, {"id": 454, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[454]</span> 二是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>驱动，加紧培育壮大新动能；", "ans": "创新"}, {"id": 455, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[455]</span> 六是坚持“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">双碳</span></span>”引领，推动全面绿色转型；", "ans": "双碳"}, {"id": 456, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[456]</span> 七是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>为大，努力为人民群众多办实事；", "ans": "民生"}, {"id": 457, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[457]</span> 围绕做强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国内</span></span>大循环，拓展内需增长新空间；", "ans": "国内"}, {"id": 458, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[458]</span> 围绕发展新质生产力，推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>创新和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">产业</span></span>创新深度融合；", "ans": "科技, 产业"}, {"id": 459, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[459]</span> 国内生产总值增长 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">5</span></span>%，总量达到 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">140</span></span>.19 万亿元。实施学前<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>年免费教育政策、惠及 1400 万儿童，全面实施<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">育儿</span></span>补贴制度、惠及3000 多万婴幼儿。粮食产量达到 1.<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">4</span></span>3 万亿斤。", "ans": "5, 140, 一, 育儿, 4"}, {"id": 460, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[460]</span> 人工智能、生物医药、机器人、量子科技等研发应用走在世界前列，芯片自主研发有了新突破，天问<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">二</span></span>号开启“追星”之旅，北斗规模应用全面拓展，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">雅下</span></span>水电工程开工建设，首艘国产<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">电磁弹射型</span></span>航母<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">福建舰</span></span>正式入列，国产大模型引领全球开源生态。", "ans": "二, 雅下, 电磁弹射型, 福建舰"}, {"id": 461, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[461]</span> 国内生产总值连续跨越 110 万亿元、120 万亿元、130 万亿元、140 万亿元台阶，年均增长 5.4%、明显高于全球平均增速。全社会研发经费投入年均增长10%。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>增加值规模连续 16 年保持全球第一，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>领域外资准入限制措施全部取消。货物贸易第<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>大国地位更加巩固。森林覆盖率提高到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">25</span></span>%以上，成为全球森林资源增长最快最多的国家，构建起全球最大、发展最快的可再生能源体系。", "ans": "制造业, 制造业, 一, 25"}, {"id": 462, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[462]</span> 坚持稳中求进、提质增效，发挥存量政策和增量政策集成效应，加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">逆</span></span>周期和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">跨</span></span>周期调节力度，切实提升宏观经济治理效能。", "ans": "逆, 跨"}, {"id": 463, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[463]</span> 继续实施更加积极的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财政</span></span>政策。今年赤字率拟按4<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">%</span></span>左右安排，赤字规模比上年增加 2300 亿元。今年财政支出继续保持相当规模，要持续用力优化支出结构，更加注重支持提振消费、投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>、保障民生等方面，提高财政资金使用效益。中央财政<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">增加</span></span>对地方财力性转移支付规模，开展整合统筹使用转移支付资金试点，增强地方自主财力和统筹能力。各级政府要更好“当家理财”，建立健全增收节支机制，强化预算约束，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">严控</span></span>一般性支出，坚决落实过紧日子的要求。", "ans": "财政, %, 人, 增加, 严控"}, {"id": 464, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[464]</span> 继续实施适度宽松的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">货币</span></span>政策。把促进经济稳定增长、物价合理<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">回升</span></span>作为货币政策的重要考量，灵活高效运用<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>准<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>息等多种政策工具，保持流动性充裕，使社会融资规模、货币供应量增长同经济增长、价格总水平预期目标相匹配。畅通货币政策传导机制，引导金融机构加力支持扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>、科技创新、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中小微</span></span>企业等重点领域。规范信贷市场经营行为，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降低</span></span>融资中间费用，促进社会综合融资成本低位运行。", "ans": "货币, 回升, 降, 降, 内需, 中小微, 降低"}, {"id": 465, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[465]</span> 强化改革举措与宏观政策协同。增强宏观政策取向一致性和有效性，将各类经济政策和非经济政策、存量政策和增量政策纳入宏观政策取向<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一致性</span></span>评估。", "ans": "一致性"}, {"id": 466, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[466]</span> 着力建设强大国内市场。坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。", "ans": "内需"}, {"id": 467, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[467]</span> （1）深入实施提振消费专项行动。制定实施城乡居民增收计划，在促进低收入群体增收、增加居民<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财产性</span></span>收入、完善薪酬和社保制度等方面推出一批务实举措。促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">商品</span></span>消费扩容升级，支持消费品以旧换新，优化政策实施机制。扩大个人消费贷款和服务业经营主体贷款<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">贴</span></span>息政策支持领域，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>贴息上限，延长实施期限。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">有条件</span></span>的地方推广中小学春秋假，落实职工带薪错峰休假制度。", "ans": "财产性, 商品, 贴, 提高, 有条件"}, {"id": 468, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[468]</span> （2）充分挖掘释放有效投资潜力。增强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>主导的有效投资增长动力，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>类政府投资比重。单列并提高用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">项目</span></span>建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。", "ans": "市场, 民生, 项目"}, {"id": 469, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[469]</span> 2.加紧培育壮大新动能。坚持把发展经济的着力点放在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实体</span></span>经济上，因地制宜发展新质生产力，建设现代化产业体系。", "ans": "实体"}, {"id": 470, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[470]</span> （2）培育壮大新兴产业和未来产业。实施产业创新工程，鼓励<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">央企国企</span></span>带头开放应用场景，打造集成电路、航空航天、生物医药、低空经济等<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">新兴</span></span>支柱产业。建立未来产业投入增长和风险分担机制，培育发展未来能源、量子科技、生物制造、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">具身</span></span>智能、脑机接口、6G等未来产业。高效用好国家创业投资引导基金，大力发展创业投资、天使投资，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业。", "ans": "央企国企, 新兴, 具身, 政府"}, {"id": 471, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[471]</span> 加强原始创新和关键核心技术攻关。继续<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>基础研究投入比重，加大长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">稳定</span></span>支持。", "ans": "提高, 稳定"}, {"id": 472, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[472]</span> 推动科技创新和产业创新深度融合。建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地。强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">企业</span></span>创新主体地位，支持科技领军企业牵头组建创新联合体，提高承担国家重大科技项目比例。", "ans": "企业"}, {"id": 473, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[473]</span> 纵深推进全国统一大市场建设。完善统计、财税、考核等制度，规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">规范</span></span>税收优惠、财政补贴政策。加强反垄断、反不正当竞争，强化公平竞争审查<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">刚性</span></span>约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">整治</span></span>“内卷式”竞争，营造良好市场生态。深化要素<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场化</span></span>配置综合改革试点，将更多符合条件的地区纳入试点范围。", "ans": "规范, 刚性, 整治, 市场化"}, {"id": 474, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[474]</span> 推进财税金融体制改革。加大财政资源和预算统筹力度，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>国有资本收益收取比例。调整优化消费税征税范围、税率，并推进部分品目征收环节后移。规范金融机构竞争秩序，深入推进地方中小金融机构<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">减</span></span>量提质。持续深化资本市场投融资综合改革，进一步健全中长期资金入市机制，完善投资者保护制度，拓展私募股权和创投基金退出渠道，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">直接</span></span>融资、股权融资比重。", "ans": "提高, 减, 直接"}];

    let currentQuizList = [];
    let currentIndex = 0;
    let startTime = null;
    let timerInterval = null;
    let userRecords = JSON.parse(localStorage.getItem('quiz_history_474_complete') || '[]');

    function toggleHistory() {
        const list = document.getElementById('history-list');
        list.style.display = list.style.display === 'block' ? 'none' : 'block';
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        if (userRecords.length === 0) {
            list.innerHTML = '<p style="font-size:0.8rem; color:#94a3b8;">暂无背诵记录</p>';
            return;
        }
        list.innerHTML = userRecords.slice(-5).reverse().map(r => 
            `<div style="font-size:0.8rem; border-bottom:1px dashed #e2e8f0; padding:6px 0; color:#475569;">
                时间: ${r.time} | 题数: ${r.count} | 耗时: ${r.duration}
            </div>`
        ).join('');
    }

    function clearHistory() {
        localStorage.removeItem('quiz_history_474_complete');
        userRecords = [];
        renderHistory();
        alert('历史记录已清空');
    }

    function startQuiz(mode, param) {
        if (mode === 'cat') {
            currentQuizList = questionDatabase.filter(item => item.cat === param);
        } else if (mode === 'all') {
            currentQuizList = [...questionDatabase];
        } else {
            let pool = [...questionDatabase];
            pool.sort(() => Math.random() - 0.5);
            currentQuizList = pool.slice(0, mode);
        }

        currentIndex = 0;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        startTime = new Date();
        startTimer();
        loadQuestion();
    }

    function returnToHome() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
    }

    function startTimer() {
        clearInterval(timerInterval);
        let seconds = 0;
        timerInterval = setInterval(() => {
            seconds++;
            let m = String(Math.floor(seconds / 60)).padStart(2, '0');
            let s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function loadQuestion() {
        if (currentIndex >= currentQuizList.length) {
            endQuiz();
            return;
        }
        const item = currentQuizList[currentIndex];
        document.getElementById('grade-standards').innerText = `进度: ${currentIndex + 1} / ${currentQuizList.length} (第 ${item.id} 题)`;
        document.getElementById('cat-tag').innerText = item.cat;
        document.getElementById('q-val').innerHTML = item.html;
    }

    function revealAnswer() {
        const spans = document.querySelectorAll('.ans-span');
        spans.forEach(span => {
            span.classList.remove('answer-hidden');
            span.classList.add('answer-show');
        });
    }

    function nextStep() {
        currentIndex++;
        loadQuestion();
    }

    function endQuiz() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let totalTimeSec = Math.floor((new Date() - startTime) / 1000);
        let durationStr = `${Math.floor(totalTimeSec / 60)}分${totalTimeSec % 60}秒`;

        document.getElementById('res-count').innerText = currentQuizList.length;
        document.getElementById('res-time').innerText = durationStr;

        let tbody = document.getElementById('res-body');
        tbody.innerHTML = currentQuizList.map(item => `
            <tr>
                <td style="text-align:left;">${item.html}</td>
                <td style="color:#ef4444; font-weight:bold;">${item.ans}</td>
            </tr>
        `).join('');

        userRecords.push({
            time: new Date().toLocaleString(),
            count: currentQuizList.length,
            duration: durationStr
        });
        localStorage.setItem('quiz_history_474_complete', JSON.stringify(userRecords));
    }
</script>

</html>
