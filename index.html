<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>政治理论全量题库背诵系统 (精准473题版)</title>
    <style>
        :root { --page-bg: #f8fafc; --btn-bg: #4f46e5; --text-color: #1e293b; --wrong: #ef4444; --exit-color: #64748b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--page-bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; color: var(--text-color); }
        .container { background: #ffffff; width: 100%; max-width: 650px; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); text-align: center; margin-top: 10px; position: relative; border: 1px solid #e2e8f0; }
        .hidden { display: none !important; }
        .btn-exit { position: absolute; top: 18px; left: 18px; border: 1px solid #cbd5e1; color: var(--exit-color); background: #ffffff; padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 500; }
        .menu-grid { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { width: 100%; background: var(--btn-bg); color: #ffffff; border: none; padding: 14px; font-size: 1rem; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .btn-cat { background: #e0e7ff; color: #3730a3; font-size: 0.9rem; padding: 10px; }
        .grade-box { font-size: 0.85rem; color: #475569; margin: 10px 0; padding: 10px 14px; background: #f1f5f9; border-radius: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .jump-box { margin: 12px 0; text-align: left; font-size: 0.9rem; color: #475569; }
        .jump-box select { padding: 7px 10px; border-radius: 6px; width: 65%; border: 1px solid #cbd5e1; background: #ffffff; }
        .progress-container { width: 100%; height: 9px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin: 10px 0 18px; }
        .progress-bar { width: 0%; height: 100%; background: #4f46e5; border-radius: 10px; transition: width 0.25s ease; }
        .question { font-size: 1.1rem; font-weight: 600; margin: 20px 0; word-break: break-all; text-align: left; line-height: 1.7; max-height: 300px; overflow-y: auto; padding-right: 8px; color: #0f172a; }
        
        /* 挖空与红色答案样式 */
        .blank-space { display: inline-block; border-bottom: 2px solid #ef4444; min-width: 50px; padding: 0 4px; color: #ef4444; font-weight: 700; text-align: center; margin: 0 2px; }
        .answer-hidden { color: transparent !important; background-color: #fee2e2; border-radius: 4px; padding: 0 4px; user-select: none; }
        .answer-show { color: #ef4444 !important; background-color: #fee2e2; border-radius: 4px; padding: 0 4px; transition: color 0.2s ease-in; }

        .history-title { padding: 12px; color: #4f46e5; cursor: pointer; border-bottom: 1px dashed #cbd5e1; font-weight: 600; font-size: 0.9rem; }
        #history-list { display: none; max-height: 180px; overflow-y: auto; text-align: left; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; word-break: break-all; }
        th { background: #f8fafc; font-weight: 600; }
    </style>
</head>

    </div>

        <button onclick="startQuiz(10)">10 题快速挑战</button>
        <button onclick="startQuiz(30)">30 题强化练习</button>
        <button onclick="startQuiz(50)">50 题标准挑战</button>
        <button style="background: #10b981;" onclick="startQuiz('all')">🔥 全部 473 题顺序通关背诵</button>
    </div>

    <div id="history-section">
        <div class="history-title" onclick="toggleHistory()">🕒 最近背诵记录 (点击展开)</div>
        <div id="history-list"></div>
        <button style="background:none; color:#ef4444; border:1px solid #fca5a5; margin-top:10px; padding:8px; font-size:0.8rem;" onclick="clearHistory()">清空背诵历史</button>
    </div>
</div>

<!-- 做题主页面 -->
<div id="game-screen" class="container hidden">
    <button class="btn-exit" onclick="returnToHome()">退出</button>
    <div id="timer" style="margin-top:25px; font-weight:bold; color:#64748b; font-size:0.9rem;">00:00</div>
    <div class="grade-box">
        <span id="grade-standards">当前进度: 1/473</span>
        <span id="cat-tag" style="background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:6px; font-weight:bold;">习思想</span>
    </div>
    <div class="jump-box">
        题目跳转：
        <select id="jump-select" onchange="jumpTo(this.value)">
            <option value="">请选择题目</option>
        </select>
    </div>
    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div class="question" id="q-val">加载中...</div>
    
    <div style="display:flex; gap:12px; margin-top: 20px;">
        <button style="background:#f59e0b; color:#ffffff;" onclick="revealAnswer()">看答案</button>
        <button style="background:#64748b;" onclick="prevStep()">上一题</button>
        <button onclick="nextStep()">认识/下一个</button>
    </div>
</div>

<!-- 结果结算页面 -->
<div id="result-screen" class="container hidden">
    <h2>背诵完成 🎉</h2>
    <p>本次练习题数：<span id="res-count" style="font-weight:bold; color:#4f46e5;"></span></p>
    <p>总用时：<span id="res-time" style="font-weight:bold; color:#10b981;"></span></p>

    <div style="max-height: 280px; overflow-y: auto;">

            <tbody id="res-body"></tbody>
        </table>
    </div>
</div>

        }
        list.innerHTML = userRecords.slice(-5).reverse().map(r => 
            `<div style="font-size:0.8rem; border-bottom:1px dashed #e2e8f0; padding:6px 0; color:#475569;">
                时间: ${r.time} | 题数: ${r.count} | 耗时: ${r.duration}
            </div>`
        ).join('');
    }

    function clearHistory() {
        localStorage.removeItem('quiz_history_474_complete');
        userRecords = [];
        renderHistory();
        alert('历史记录已清空');
    }

    function startQuiz(mode, param) {
        if (mode === 'cat') {
            currentQuizList = questionDatabase.filter(item => item.cat === param);
        } else if (mode === 'all') {
            currentQuizList = [...questionDatabase];
        } else {
            let pool = [...questionDatabase];
            pool.sort(() => Math.random() - 0.5);
            currentQuizList = pool.slice(0, mode);
        }

        currentIndex = 0;

        // 根据本次练习题目生成跳转列表
        const jumpSelect = document.getElementById('jump-select');
        jumpSelect.innerHTML = '<option value="">请选择题目</option>' +
            currentQuizList.map((item, index) =>
                `<option value="${index}">第 ${item.id} 题</option>`
            ).join('');

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        startTime = new Date();
        startTimer();
        loadQuestion();
    }

    function returnToHome() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
    }

    function startTimer() {
        clearInterval(timerInterval);
        let seconds = 0;
        timerInterval = setInterval(() => {
            seconds++;
            let m = String(Math.floor(seconds / 60)).padStart(2, '0');
            let s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function loadQuestion() {
        if (currentIndex >= currentQuizList.length) {
            endQuiz();
            return;
        }
        const item = currentQuizList[currentIndex];
        document.getElementById('grade-standards').innerText = `进度: ${currentIndex + 1} / ${currentQuizList.length} (第 ${item.id} 题)`;
        document.getElementById('cat-tag').innerText = item.cat;
        document.getElementById('q-val').innerHTML = item.html;

        // 同步题目跳转位置和进度条
        document.getElementById('jump-select').value = currentIndex;
        const progress = ((currentIndex + 1) / currentQuizList.length) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';
    }

    function revealAnswer() {
        const spans = document.querySelectorAll('.ans-span');
        spans.forEach(span => {
            span.classList.remove('answer-hidden');
            span.classList.add('answer-show');
        });
    }

    function jumpTo(value) {
        if (value === '') return;
        const targetIndex = parseInt(value, 10);
        if (!Number.isInteger(targetIndex) || targetIndex < 0 || targetIndex >= currentQuizList.length) return;
        currentIndex = targetIndex;
        loadQuestion();
    }

    function prevStep() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function nextStep() {
        currentIndex++;
        loadQuestion();
    }

    function endQuiz() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let totalTimeSec = Math.floor((new Date() - startTime) / 1000);
        let durationStr = `${Math.floor(totalTimeSec / 60)}分${totalTimeSec % 60}秒`;

        document.getElementById('res-count').innerText = currentQuizList.length;
        document.getElementById('res-time').innerText = durationStr;

        let tbody = document.getElementById('res-body');
        tbody.innerHTML = currentQuizList.map(item => `
            <tr>
                <td style="text-align:left;">${item.html}</td>
                <td style="color:#ef4444; font-weight:bold;">${item.ans}</td>
            </tr>
        `).join('');

        userRecords.push({
            time: new Date().toLocaleString(),
            count: currentQuizList.length,
            duration: durationStr
        });
        localStorage.setItem('quiz_history_474_complete', JSON.stringify(userRecords));
    }
</script>
</body>
</html>
