style=\"color:#10b981; font-weight:bold;\">[236]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">质变</span></span>是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">量变</span></span>的必然结果，量变达到一定<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">程度</span></span>必然引起质变。", "ans": "质变, 量变, 程度"}, {"id": 237, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[237]</span> 三、否定之否定规律：揭示了事物发展的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">方向</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">道路</span></span>", "ans": "方向, 道路"}, {"id": 238, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[238]</span> 辩证的否定是事物的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自我</span></span>否定。", "ans": "自我"}, {"id": 239, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[239]</span> 辩证的否定的实质是“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">扬弃</span></span>”，即既克服又保留。", "ans": "扬弃"}, {"id": 240, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[240]</span> 事物的发展表现为<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">螺旋式</span></span>上升和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">波浪式</span></span>前进的过程。", "ans": "螺旋式, 波浪式"}, {"id": 241, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[241]</span> 事物的发展过程是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">前进性</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">曲折性</span></span>的统一。", "ans": "前进性, 曲折性"}, {"id": 242, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[242]</span> 实践是认识的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">来源</span></span>。", "ans": "来源"}, {"id": 243, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[243]</span> 实践是认识发展的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">动力</span></span>。", "ans": "动力"}, {"id": 244, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[244]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">正确</span></span>的认识对实践起着积极的促进作用；<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">错误</span></span>的认识则对实践起消极的阻碍作用，甚至导致实践的失败。", "ans": "正确, 错误"}, {"id": 245, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[245]</span> 社会历史发展的基本规律指社会的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>矛盾运动，社会<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>矛盾包括生产力与生产关系的矛盾、经济基础与上层建筑的矛盾。社会<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>矛盾是社会历史发展的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">根本</span></span>动力。", "ans": "基本, 基本, 基本, 根本"}, {"id": 246, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[246]</span> 生产力的基本要素包括劳动者、劳动资料、劳动对象。其中，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">劳动者</span></span>起主导作用。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">生产工具</span></span>是劳动资料的主要内容，是生产力发展水平的客观标志。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科学技术</span></span>是第一生产力，是先进生产力的集中体现和主要标志。", "ans": "劳动者, 生产工具, 科学技术"}, {"id": 247, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[247]</span> 生产关系由生产资料的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">所有制</span></span>形式、人们在生产中的地位和相互关系、产品<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">分配</span></span>形式等方面构成。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">生产资料所有制形式</span></span>是生产关系的基础，是区分社会制度的根本标志。", "ans": "所有制, 分配, 生产资料所有制形式"}, {"id": 248, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[248]</span> 生产力<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">决定</span></span>生产关系；生产关系对生产力具有能动的反作用；生产力与生产关系的矛盾运动推动社会发展。", "ans": "决定"}, {"id": 249, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[249]</span> 经济基础是指由社会一定发展阶段的生产力所决定的生产关系的总和。经济基础中具有决定意义的是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">生产资料所有制</span></span>。", "ans": "生产资料所有制"}, {"id": 250, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[250]</span> 观念上层建筑：包括政治法律思想、道德、艺术、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">宗教</span></span>、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">哲学</span></span>等意识形态。", "ans": "宗教, 哲学"}, {"id": 251, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[251]</span> 在整个上层建筑中，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>上层建筑居主导地位，国家政权是核心。", "ans": "政治"}, {"id": 252, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[252]</span> 经济基础<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">决定</span></span>上层建筑；上层建筑反作用于经济基础；经济基础与上层建筑的矛盾运动推动社会发展。", "ans": "决定"}, {"id": 253, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[253]</span> 社会基本矛盾中<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">生产力</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">生产关系</span></span>的矛盾是更根本的，它决定<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">经济基础</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">上层建筑</span></span>的矛盾；而生产力和生产关系矛盾的解决又依赖于经济基础和上层建筑矛盾的解决。", "ans": "生产力, 生产关系, 经济基础, 上层建筑"}, {"id": 254, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[254]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">英雄</span></span>史观把历史发展的原因归于少数统治者或社会精英的创造，属于历史唯心主义观点。", "ans": "英雄"}, {"id": 255, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[255]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">群众</span></span>史观认为对历史发展起决定作用的是人民群众，但是也<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">承认</span></span>个人尤其是少数历史人物的作用，属于历史唯物主义观点。", "ans": "群众, 承认"}, {"id": 256, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[256]</span> 人民群众是社会历史的主体，是历史的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创造者</span></span>，对社会发展起决定性作用。", "ans": "创造者"}, {"id": 257, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[257]</span> 物质的唯一特性是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">客观实在性</span></span>。", "ans": "客观实在性"}, {"id": 258, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[258]</span> 物质的根本属性和存在方式是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">运动</span></span>。", "ans": "运动"}, {"id": 259, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[259]</span> 世界上的事物都是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">绝对</span></span>运动和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">相对</span></span>静止的统一。", "ans": "绝对, 相对"}, {"id": 260, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[260]</span> 意识的本质是人脑对客观存在的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主观映象</span></span>。", "ans": "主观映象"}, {"id": 261, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[261]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物质</span></span>决定<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">意识</span></span>，要求一切从实际出发。", "ans": "物质, 意识"}, {"id": 262, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[262]</span> 意识具有<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主观能动性</span></span>，对物质起能动的反作用。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">正确</span></span>的意识对事物的发展具有促进作用，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">错误</span></span>的意识对事物的发展具有阻碍作用。", "ans": "主观能动性, 正确, 错误"}, {"id": 263, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[263]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">尊重客观规律</span></span>是正确发挥主观能动性的前提。", "ans": "尊重客观规律"}, {"id": 264, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[264]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">联系</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">发展</span></span>的观点是唯物辩证法的总观点和总特征。", "ans": "联系, 发展"}, {"id": 265, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[265]</span> （1）联系的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">客观性</span></span>", "ans": "客观性"}, {"id": 266, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[266]</span> （2）联系的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">普遍性</span></span>", "ans": "普遍性"}, {"id": 267, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[267]</span> 部分<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">影响</span></span>整体，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">关键</span></span>部分的功能及其变化甚至决定整体的功能。", "ans": "影响, 关键"}, {"id": 268, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[268]</span> 必须坚持投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物</span></span>和投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>紧密结合。", "ans": "物, 人"}, {"id": 269, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[269]</span> 一是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，建设强大国内市场；", "ans": "内需"}, {"id": 270, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[270]</span> 二是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>驱动，加紧培育壮大新动能；", "ans": "创新"}, {"id": 271, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[271]</span> 六是坚持“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">双碳</span></span>”引领，推动全面绿色转型；", "ans": "双碳"}, {"id": 272, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[272]</span> 七是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>为大，努力为人民群众多办实事；", "ans": "民生"}, {"id": 273, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[273]</span> 围绕做强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国内</span></span>大循环，拓展内需增长新空间；", "ans": "国内"}, {"id": 274, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[274]</span> 围绕发展新质生产力，推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>创新和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">产业</span></span>创新深度融合；", "ans": "科技, 产业"}, {"id": 275, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[275]</span> 国内生产总值增长 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">5</span></span>%，总量达到 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">140</span></span>.19 万亿元。实施学前<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>年免费教育政策、惠及 1400 万儿童，全面实施<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">育儿</span></span>补贴制度、惠及3000 多万婴幼儿。粮食产量达到 1.<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">4</span></span>3 万亿斤。", "ans": "5, 140, 一, 育儿, 4"}, {"id": 276, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[276]</span> 人工智能、生物医药、机器人、量子科技等研发应用走在世界前列，芯片自主研发有了新突破，天问<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">二</span></span>号开启“追星”之旅，北斗规模应用全面拓展，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">雅下</span></span>水电工程开工建设，首艘国产<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">电磁弹射型</span></span>航母<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">福建舰</span></span>正式入列，国产大模型引领全球开源生态。", "ans": "二, 雅下, 电磁弹射型, 福建舰"}, {"id": 277, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[277]</span> 国内生产总值连续跨越 110 万亿元、120 万亿元、130 万亿元、140 万亿元台阶，年均增长 5.4%、明显高于全球平均增速。全社会研发经费投入年均增长10%。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>增加值规模连续 16 年保持全球第一，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>领域外资准入限制措施全部取消。货物贸易第<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>大国地位更加巩固。森林覆盖率提高到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">25</span></span>%以上，成为全球森林资源增长最快最多的国家，构建起全球最大、发展最快的可再生能源体系。", "ans": "制造业, 制造业, 一, 25"}, {"id": 278, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[278]</span> 坚持稳中求进、提质增效，发挥存量政策和增量政策集成效应，加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">逆</span></span>周期和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">跨</span></span>周期调节力度，切实提升宏观经济治理效能。", "ans": "逆, 跨"}, {"id": 279, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[279]</span> 继续实施更加积极的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财政</span></span>政策。今年赤字率拟按4<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">%</span></span>左右安排，赤字规模比上年增加 2300 亿元。今年财政支出继续保持相当规模，要持续用力优化支出结构，更加注重支持提振消费、投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>、保障民生等方面，提高财政资金使用效益。中央财政<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">增加</span></span>对地方财力性转移支付规模，开展整合统筹使用转移支付资金试点，增强地方自主财力和统筹能力。各级政府要更好“当家理财”，建立健全增收节支机制，强化预算约束，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">严控</span></span>一般性支出，坚决落实过紧日子的要求。", "ans": "财政, %, 人, 增加, 严控"}, {"id": 280, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[280]</span> 继续实施适度宽松的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">货币</span></span>政策。把促进经济稳定增长、物价合理<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">回升</span></span>作为货币政策的重要考量，灵活高效运用<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>准<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>息等多种政策工具，保持流动性充裕，使社会融资规模、货币供应量增长同经济增长、价格总水平预期目标相匹配。畅通货币政策传导机制，引导金融机构加力支持扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>、科技创新、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中小微</span></span>企业等重点领域。规范信贷市场经营行为，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降低</span></span>融资中间费用，促进社会综合融资成本低位运行。", "ans": "货币, 回升, 降, 降, 内需, 中小微, 降低"}, {"id": 281, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[281]</span> 强化改革举措与宏观政策协同。增强宏观政策取向一致性和有效性，将各类经济政策和非经济政策、存量政策和增量政策纳入宏观政策取向<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一致性</span></span>评估。", "ans": "一致性"}, {"id": 282, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[282]</span> 着力建设强大国内市场。坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。", "ans": "内需"}, {"id": 283, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[283]</span> （1）深入实施提振消费专项行动。制定实施城乡居民增收计划，在促进低收入群体增收、增加居民<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财产性</span></span>收入、完善薪酬和社保制度等方面推出一批务实举措。促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">商品</span></span>消费扩容升级，支持消费品以旧换新，优化政策实施机制。扩大个人消费贷款和服务业经营主体贷款<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">贴</span></span>息政策支持领域，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>贴息上限，延长实施期限。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">有条件</span></span>的地方推广中小学春秋假，落实职工带薪错峰休假制度。", "ans": "财产性, 商品, 贴, 提高, 有条件"}, {"id": 284, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[284]</span> （2）充分挖掘释放有效投资潜力。增强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>主导的有效投资增长动力，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>类政府投资比重。单列并提高用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">项目</span></span>建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。", "ans": "市场, 民生, 项目"}, {"id": 285, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[285]</span> 2.加紧培育壮大新动能。坚持把发展经济的着力点放在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实体</span></span>经济上，因地制宜发展新质生产力，建设现代化产业体系。", "ans": "实体"}, {"id": 286, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[286]</span> （2）培育壮大新兴产业和未来产业。实施产业创新工程，鼓励<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">央企国企</span></span>带头开放应用场景，打造集成电路、航空航天、生物医药、低空经济等<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">新兴</span></span>支柱产业。建立未来产业投入增长和风险分担机制，培育发展未来能源、量子科技、生物制造、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">具身</span></span>智能、脑机接口、6G等未来产业。高效用好国家创业投资引导基金，大力发展创业投资、天使投资，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业。", "ans": "央企国企, 新兴, 具身, 政府"}, {"id": 287, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[287]</span> 加强原始创新和关键核心技术攻关。继续<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>基础研究投入比重，加大长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">稳定</span></span>支持。", "ans": "提高, 稳定"}, {"id": 288, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[288]</span> 推动科技创新和产业创新深度融合。建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地。强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">企业</span></span>创新主体地位，支持科技领军企业牵头组建创新联合体，提高承担国家重大科技项目比例。", "ans": "企业"}, {"id": 289, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[289]</span> 纵深推进全国统一大市场建设。完善统计、财税、考核等制度，规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">规范</span></span>税收优惠、财政补贴政策。加强反垄断、反不正当竞争，强化公平竞争审查<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">刚性</span></span>约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">整治</span></span>“内卷式”竞争，营造良好市场生态。深化要素<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场化</span></span>配置综合改革试点，将更多符合条件的地区纳入试点范围。", "ans": "规范, 刚性, 整治, 市场化"}, {"id": 290, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[290]</span> 推进财税金融体制改革。加大财政资源和预算统筹力度，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>国有资本收益收取比例。调整优化消费税征税范围、税率，并推进部分品目征收环节后移。规范金融机构竞争秩序，深入推进地方中小金融机构<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">减</span></span>量提质。持续深化资本市场投融资综合改革，进一步健全中长期资金入市机制，完善投资者保护制度，拓展私募股权和创投基金退出渠道，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">直接</span></span>融资、股权融资比重。", "ans": "提高, 减, 直接"}, {"id": 291, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[291]</span> 5.进一步扩大高水平对外开放。坚持合作共赢，稳步扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度型</span></span>开放，拓展国际循环，以开放促改革促发展。", "ans": "制度型"}, {"id": 292, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[292]</span> （1）积极扩大自主开放。以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">服务业</span></span>为重点扩大市场准入和开放领域，进一步扩大增值电信、生物技术、外商独资医院等领域开放试点，有序扩大数字领域开放，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">压减</span></span>跨境服务贸易负面清单。优化自由贸易试验区布局范围、提升创新引领发展能级，扎实推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">海南</span></span>自由贸易港建设。", "ans": "服务业, 压减, 海南"}, {"id": 293, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[293]</span> （3）扩大双向投资合作。深化外商投资促进体制机制改革，保障外资企业国民待遇，实施新版鼓励外商投资产业目录，促进外资境内再投资、扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">本地化</span></span>生产。", "ans": "本地化"}, {"id": 294, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[294]</span> （1）深入推进以人为本的新型城镇化。科学有序推进农业转移人口市民化，因地制宜放宽在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">流入地</span></span>参加中考报名条件，进一步完善“人地钱”挂钩政策。坚持城市内涵式发展，优化现代化城市体系。", "ans": "流入地"}, {"id": 295, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[295]</span> （2）不断增强区域发展协调性。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">京津冀</span></span>、长三角、粤港澳大湾区打造世界级城市群。加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差异化</span></span>政策支持力度，深入推进兴边富民行动，促进革命老区、民族地区、边疆地区、资源枯竭城市等振兴发展。", "ans": "京津冀, 差异化"}, {"id": 296, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[296]</span> （1）促进高质量充分就业。实施稳岗扩容提质行动，支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">劳动</span></span>密集型行业企业稳定岗位。", "ans": "劳动"}, {"id": 297, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[297]</span> （2）推动教育公平与质量提升。推动基础教育扩优提质，统筹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">义务</span></span>教育优质均衡发展、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">学前</span></span>教育优质普惠发展，完善免费学前教育政策，增加普通高中学位供给。", "ans": "义务, 学前"}, {"id": 298, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[298]</span> （3）强化基本医疗卫生服务。健全医疗、医保、医药<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">协同</span></span>发展和治理机制，深化以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>为导向的公立医院改革，加强县区、基层医疗机构运行保障。健全多层次医疗保障体系，稳步推动基本医疗保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">省级</span></span>统筹。", "ans": "协同, 公益性, 省级"}, {"id": 299, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[299]</span> （4）加强社会保障和服务。完善并落实基本养老保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全国</span></span>统筹制度，扩大失业、工伤保险覆盖面，稳妥有序推进职业伤害保障试点扩围，健全社保关系转移接续政策。加强初婚初育家庭住房保障，支持多子女家庭<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">改善性</span></span>住房需求。", "ans": "全国, 改善性"}, {"id": 300, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[300]</span> （1）着力稳定房地产市场。因城施策控增量、去库存、优供给，探索多渠道盘活存量商品房，鼓励收购存量商品房重点用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保障</span></span>性住房等。进一步发挥“保交房”的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">白</span></span>名单制度作用，防范债务违约风险。", "ans": "保障, 白"}, {"id": 301, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[301]</span> 到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2035</span></span>年建成健康中国，是中共中央作出的一项战略决策。“十五五”是实现这一目标的关键时期，我们必须统筹谋划、加紧推进，力求取得<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">决定性</span></span>进展。", "ans": "2035, 决定性"}, {"id": 302, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[302]</span> 第一，坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差距</span></span>仍然较大的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>，走中国特色卫生与健康发展道路。", "ans": "差距, 公益性"}, {"id": 303, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[303]</span> 中共中央明确提出新时代卫生与健康工作方针，即以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基层</span></span>为重点，以改革创新为动力，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">预防</span></span>为主，中西医并重，把健康融入所有政策，人民共建共享。", "ans": "基层, 预防"}, {"id": 304, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[304]</span> 第二，突出重点推进健康中国建设。要继续优化体系布局，实施医疗卫生强基工程，促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">分级</span></span>诊疗，加强县区和基层医疗卫生机构运行保障。", "ans": "分级"}, {"id": 305, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[305]</span> 第三，为健康中国建设提供有力保障。要健全党委统一领导、党政齐抓共管的工作格局，将健康理念融入公共政策制定实施的全过程。要深化公立医院改革和医保支付方式改革，健全药品价格形成机制、优化药品和医用耗材<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">集中</span></span>采购政策，提高医保资金使用效率，完善医疗、医保、医药协同发展和治理机制。", "ans": "集中"}, {"id": 306, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[306]</span> 2025 年，党中央深入推进党风廉政建设和反腐败斗争，取得显著成效。强化政治监督，深化政治巡视，有力保障党中央重大决策部署贯彻落实；扎实开展深入贯彻<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中央八项规定</span></span>精神学习教育，推动全党进一步改作风树新风；保持反腐败高压态势，推进风腐同查同治，深化整治群众身边不正之风和腐败问题，着力铲除腐败滋生的土壤和条件。", "ans": "中央八项规定"}, {"id": 307, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[307]</span> 深刻把握实现“十五五”时期目标任务对把权力关进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>笼子提出的更高要求，坚定不移强化制度治权、依规用权；", "ans": "制度"}, {"id": 308, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[308]</span> 第一，强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>监督，推动全党凝心聚力实现“十五五”时期目标任务。", "ans": "政治"}, {"id": 309, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[309]</span> 第二，强化正风肃纪，巩固拓展深入贯彻中央八项规定精神学习教育成果。持续狠刹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">享乐</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">奢靡</span></span>之风，对违规吃喝、违规收送礼品礼金等易发多发问题深化整治；对以调研考察、开展党建活动、培训的名义搞公款旅游，变相公款出国（境）旅游等问题严肃查处；对借民生项目违规建设楼堂馆所等新动向密切关注并纠治。持续整治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">形式</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">官僚</span></span>主义，坚决纠治临近换届等待观望不作为，换届后急功近利“翻烧饼”、搞“政绩工程”等突出问题，推动为基层减负。", "ans": "享乐, 奢靡, 形式, 官僚"}, {"id": 310, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[310]</span> 第三，强化标本兼治，用好一体推进不敢腐、不能腐、不想腐战略抓手。以保持高压震慑强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不敢</span></span>腐，坚持猛药去疴、重典治乱。以加强监督制约强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不能</span></span>腐，健全授权用权制权相统一、清晰透明可追溯的制度机制。以深化廉洁教育强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不想</span></span>腐，不断塑造清正廉洁的思想品格、廉洁奉公的政德修养、廉洁自律的道德操守、崇廉拒腐的社会风尚。以完善体制机制促进一体推进，健全党委统一领导下的反腐败工作机制。", "ans": "不敢, 不能, 不想"}, {"id": 311, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[311]</span> 第四，强化执纪执法为民，持续深化群众身边不正之风和腐败问题集中整治。推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">县</span></span>级主战场持续深化整治工作，发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">群众</span></span>监督作用，提升基层监督能力。", "ans": "县, 群众"}, {"id": 312, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[312]</span> 第五，强化政治巡视，增强巡视监督震慑力、穿透力、推动力。深化巡视巡察上下联动，加强对省区市<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、中央单位内部<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、对村<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡察</span></span>工作指导督导。第六，强化铁军意识，不断提高纪检监察工作规范化法治化正规化水平。", "ans": "巡视, 巡视, 巡察"}, {"id": 313, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[313]</span> 党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党、怎样建设长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。", "ans": "执政, 马克思主义, 执政, 马克思主义"}, {"id": 314, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[314]</span> 必须坚持投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物</span></span>和投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>紧密结合。", "ans": "物, 人"}, {"id": 315, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[315]</span> 一是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，建设强大国内市场；", "ans": "内需"}, {"id": 316, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[316]</span> 二是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>驱动，加紧培育壮大新动能；", "ans": "创新"}, {"id": 317, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[317]</span> 六是坚持“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">双碳</span></span>”引领，推动全面绿色转型；", "ans": "双碳"}, {"id": 318, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[318]</span> 七是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>为大，努力为人民群众多办实事；", "ans": "民生"}, {"id": 319, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[319]</span> 围绕做强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国内</span></span>大循环，拓展内需增长新空间；", "ans": "国内"}, {"id": 320, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[320]</span> 围绕发展新质生产力，推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>创新和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">产业</span></span>创新深度融合；", "ans": "科技, 产业"}, {"id": 321, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[321]</span> 国内生产总值增长 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">5</span></span>%，总量达到 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">140</span></span>.19 万亿元。实施学前<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>年免费教育政策、惠及 1400 万儿童，全面实施<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">育儿</span></span>补贴制度、惠及3000 多万婴幼儿。粮食产量达到 1.<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">4</span></span>3 万亿斤。", "ans": "5, 140, 一, 育儿, 4"}, {"id": 322, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[322]</span> 人工智能、生物医药、机器人、量子科技等研发应用走在世界前列，芯片自主研发有了新突破，天问<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">二</span></span>号开启“追星”之旅，北斗规模应用全面拓展，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">雅下</span></span>水电工程开工建设，首艘国产<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">电磁弹射型</span></span>航母<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">福建舰</span></span>正式入列，国产大模型引领全球开源生态。", "ans": "二, 雅下, 电磁弹射型, 福建舰"}, {"id": 323, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[323]</span> 国内生产总值连续跨越 110 万亿元、120 万亿元、130 万亿元、140 万亿元台阶，年均增长 5.4%、明显高于全球平均增速。全社会研发经费投入年均增长10%。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>增加值规模连续 16 年保持全球第一，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>领域外资准入限制措施全部取消。货物贸易第<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>大国地位更加巩固。森林覆盖率提高到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">25</span></span>%以上，成为全球森林资源增长最快最多的国家，构建起全球最大、发展最快的可再生能源体系。", "ans": "制造业, 制造业, 一, 25"}, {"id": 324, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[324]</span> 坚持稳中求进、提质增效，发挥存量政策和增量政策集成效应，加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">逆</span></span>周期和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">跨</span></span>周期调节力度，切实提升宏观经济治理效能。", "ans": "逆, 跨"}, {"id": 325, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[325]</span> 继续实施更加积极的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财政</span></span>政策。今年赤字率拟按4<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">%</span></span>左右安排，赤字规模比上年增加 2300 亿元。今年财政支出继续保持相当规模，要持续用力优化支出结构，更加注重支持提振消费、投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>、保障民生等方面，提高财政资金使用效益。中央财政<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">增加</span></span>对地方财力性转移支付规模，开展整合统筹使用转移支付资金试点，增强地方自主财力和统筹能力。各级政府要更好“当家理财”，建立健全增收节支机制，强化预算约束，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">严控</span></span>一般性支出，坚决落实过紧日子的要求。", "ans": "财政, %, 人, 增加, 严控"}, {"id": 326, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[326]</span> 继续实施适度宽松的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">货币</span></span>政策。把促进经济稳定增长、物价合理<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">回升</span></span>作为货币政策的重要考量，灵活高效运用<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>准<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>息等多种政策工具，保持流动性充裕，使社会融资规模、货币供应量增长同经济增长、价格总水平预期目标相匹配。畅通货币政策传导机制，引导金融机构加力支持扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>、科技创新、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中小微</span></span>企业等重点领域。规范信贷市场经营行为，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降低</span></span>融资中间费用，促进社会综合融资成本低位运行。", "ans": "货币, 回升, 降, 降, 内需, 中小微, 降低"}, {"id": 327, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[327]</span> 强化改革举措与宏观政策协同。增强宏观政策取向一致性和有效性，将各类经济政策和非经济政策、存量政策和增量政策纳入宏观政策取向<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一致性</span></span>评估。", "ans": "一致性"}, {"id": 328, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[328]</span> 着力建设强大国内市场。坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。", "ans": "内需"}, {"id": 329, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[329]</span> （1）深入实施提振消费专项行动。制定实施城乡居民增收计划，在促进低收入群体增收、增加居民<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财产性</span></span>收入、完善薪酬和社保制度等方面推出一批务实举措。促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">商品</span></span>消费扩容升级，支持消费品以旧换新，优化政策实施机制。扩大个人消费贷款和服务业经营主体贷款<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">贴</span></span>息政策支持领域，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>贴息上限，延长实施期限。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">有条件</span></span>的地方推广中小学春秋假，落实职工带薪错峰休假制度。", "ans": "财产性, 商品, 贴, 提高, 有条件"}, {"id": 330, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[330]</span> （2）充分挖掘释放有效投资潜力。增强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>主导的有效投资增长动力，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>类政府投资比重。单列并提高用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">项目</span></span>建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。", "ans": "市场, 民生, 项目"}, {"id": 331, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[331]</span> 2.加紧培育壮大新动能。坚持把发展经济的着力点放在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实体</span></span>经济上，因地制宜发展新质生产力，建设现代化产业体系。", "ans": "实体"}, {"id": 332, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[332]</span> （2）培育壮大新兴产业和未来产业。实施产业创新工程，鼓励<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">央企国企</span></span>带头开放应用场景，打造集成电路、航空航天、生物医药、低空经济等<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">新兴</span></span>支柱产业。建立未来产业投入增长和风险分担机制，培育发展未来能源、量子科技、生物制造、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">具身</span></span>智能、脑机接口、6G等未来产业。高效用好国家创业投资引导基金，大力发展创业投资、天使投资，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业。", "ans": "央企国企, 新兴, 具身, 政府"}, {"id": 333, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[333]</span> 加强原始创新和关键核心技术攻关。继续<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>基础研究投入比重，加大长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">稳定</span></span>支持。", "ans": "提高, 稳定"}, {"id": 334, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[334]</span> 推动科技创新和产业创新深度融合。建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地。强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">企业</span></span>创新主体地位，支持科技领军企业牵头组建创新联合体，提高承担国家重大科技项目比例。", "ans": "企业"}, {"id": 335, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[335]</span> 纵深推进全国统一大市场建设。完善统计、财税、考核等制度，规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">规范</span></span>税收优惠、财政补贴政策。加强反垄断、反不正当竞争，强化公平竞争审查<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">刚性</span></span>约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">整治</span></span>“内卷式”竞争，营造良好市场生态。深化要素<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场化</span></span>配置综合改革试点，将更多符合条件的地区纳入试点范围。", "ans": "规范, 刚性, 整治, 市场化"}, {"id": 336, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[336]</span> 推进财税金融体制改革。加大财政资源和预算统筹力度，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>国有资本收益收取比例。调整优化消费税征税范围、税率，并推进部分品目征收环节后移。规范金融机构竞争秩序，深入推进地方中小金融机构<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">减</span></span>量提质。持续深化资本市场投融资综合改革，进一步健全中长期资金入市机制，完善投资者保护制度，拓展私募股权和创投基金退出渠道，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">直接</span></span>融资、股权融资比重。", "ans": "提高, 减, 直接"}, {"id": 337, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[337]</span> 5.进一步扩大高水平对外开放。坚持合作共赢，稳步扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度型</span></span>开放，拓展国际循环，以开放促改革促发展。", "ans": "制度型"}, {"id": 338, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[338]</span> （1）积极扩大自主开放。以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">服务业</span></span>为重点扩大市场准入和开放领域，进一步扩大增值电信、生物技术、外商独资医院等领域开放试点，有序扩大数字领域开放，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">压减</span></span>跨境服务贸易负面清单。优化自由贸易试验区布局范围、提升创新引领发展能级，扎实推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">海南</span></span>自由贸易港建设。", "ans": "服务业, 压减, 海南"}, {"id": 339, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[339]</span> （3）扩大双向投资合作。深化外商投资促进体制机制改革，保障外资企业国民待遇，实施新版鼓励外商投资产业目录，促进外资境内再投资、扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">本地化</span></span>生产。", "ans": "本地化"}, {"id": 340, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[340]</span> （1）深入推进以人为本的新型城镇化。科学有序推进农业转移人口市民化，因地制宜放宽在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">流入地</span></span>参加中考报名条件，进一步完善“人地钱”挂钩政策。坚持城市内涵式发展，优化现代化城市体系。", "ans": "流入地"}, {"id": 341, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[341]</span> （2）不断增强区域发展协调性。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">京津冀</span></span>、长三角、粤港澳大湾区打造世界级城市群。加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差异化</span></span>政策支持力度，深入推进兴边富民行动，促进革命老区、民族地区、边疆地区、资源枯竭城市等振兴发展。", "ans": "京津冀, 差异化"}, {"id": 342, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[342]</span> （1）促进高质量充分就业。实施稳岗扩容提质行动，支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">劳动</span></span>密集型行业企业稳定岗位。", "ans": "劳动"}, {"id": 343, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[343]</span> （2）推动教育公平与质量提升。推动基础教育扩优提质，统筹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">义务</span></span>教育优质均衡发展、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">学前</span></span>教育优质普惠发展，完善免费学前教育政策，增加普通高中学位供给。", "ans": "义务, 学前"}, {"id": 344, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[344]</span> （3）强化基本医疗卫生服务。健全医疗、医保、医药<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">协同</span></span>发展和治理机制，深化以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>为导向的公立医院改革，加强县区、基层医疗机构运行保障。健全多层次医疗保障体系，稳步推动基本医疗保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">省级</span></span>统筹。", "ans": "协同, 公益性, 省级"}, {"id": 345, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[345]</span> （4）加强社会保障和服务。完善并落实基本养老保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全国</span></span>统筹制度，扩大失业、工伤保险覆盖面，稳妥有序推进职业伤害保障试点扩围，健全社保关系转移接续政策。加强初婚初育家庭住房保障，支持多子女家庭<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">改善性</span></span>住房需求。", "ans": "全国, 改善性"}, {"id": 346, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[346]</span> （1）着力稳定房地产市场。因城施策控增量、去库存、优供给，探索多渠道盘活存量商品房，鼓励收购存量商品房重点用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保障</span></span>性住房等。进一步发挥“保交房”的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">白</span></span>名单制度作用，防范债务违约风险。", "ans": "保障, 白"}, {"id": 347, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[347]</span> 到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2035</span></span>年建成健康中国，是中共中央作出的一项战略决策。“十五五”是实现这一目标的关键时期，我们必须统筹谋划、加紧推进，力求取得<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">决定性</span></span>进展。", "ans": "2035, 决定性"}, {"id": 348, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[348]</span> 第一，坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差距</span></span>仍然较大的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>，走中国特色卫生与健康发展道路。", "ans": "差距, 公益性"}, {"id": 349, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[349]</span> 中共中央明确提出新时代卫生与健康工作方针，即以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基层</span></span>为重点，以改革创新为动力，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">预防</span></span>为主，中西医并重，把健康融入所有政策，人民共建共享。", "ans": "基层, 预防"}, {"id": 350, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[350]</span> 第二，突出重点推进健康中国建设。要继续优化体系布局，实施医疗卫生强基工程，促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">分级</span></span>诊疗，加强县区和基层医疗卫生机构运行保障。", "ans": "分级"}, {"id": 351, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[351]</span> 第三，为健康中国建设提供有力保障。要健全党委统一领导、党政齐抓共管的工作格局，将健康理念融入公共政策制定实施的全过程。要深化公立医院改革和医保支付方式改革，健全药品价格形成机制、优化药品和医用耗材<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">集中</span></span>采购政策，提高医保资金使用效率，完善医疗、医保、医药协同发展和治理机制。", "ans": "集中"}, {"id": 352, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[352]</span> 2025 年，党中央深入推进党风廉政建设和反腐败斗争，取得显著成效。强化政治监督，深化政治巡视，有力保障党中央重大决策部署贯彻落实；扎实开展深入贯彻<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中央八项规定</span></span>精神学习教育，推动全党进一步改作风树新风；保持反腐败高压态势，推进风腐同查同治，深化整治群众身边不正之风和腐败问题，着力铲除腐败滋生的土壤和条件。", "ans": "中央八项规定"}, {"id": 353, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[353]</span> 深刻把握实现“十五五”时期目标任务对把权力关进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>笼子提出的更高要求，坚定不移强化制度治权、依规用权；", "ans": "制度"}, {"id": 354, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[354]</span> 第一，强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>监督，推动全党凝心聚力实现“十五五”时期目标任务。", "ans": "政治"}, {"id": 355, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[355]</span> 第二，强化正风肃纪，巩固拓展深入贯彻中央八项规定精神学习教育成果。持续狠刹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">享乐</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">奢靡</span></span>之风，对违规吃喝、违规收送礼品礼金等易发多发问题深化整治；对以调研考察、开展党建活动、培训的名义搞公款旅游，变相公款出国（境）旅游等问题严肃查处；对借民生项目违规建设楼堂馆所等新动向密切关注并纠治。持续整治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">形式</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">官僚</span></span>主义，坚决纠治临近换届等待观望不作为，换届后急功近利“翻烧饼”、搞“政绩工程”等突出问题，推动为基层减负。", "ans": "享乐, 奢靡, 形式, 官僚"}, {"id": 356, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[356]</span> 第三，强化标本兼治，用好一体推进不敢腐、不能腐、不想腐战略抓手。以保持高压震慑强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不敢</span></span>腐，坚持猛药去疴、重典治乱。以加强监督制约强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不能</span></span>腐，健全授权用权制权相统一、清晰透明可追溯的制度机制。以深化廉洁教育强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不想</span></span>腐，不断塑造清正廉洁的思想品格、廉洁奉公的政德修养、廉洁自律的道德操守、崇廉拒腐的社会风尚。以完善体制机制促进一体推进，健全党委统一领导下的反腐败工作机制。", "ans": "不敢, 不能, 不想"}, {"id": 357, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[357]</span> 第四，强化执纪执法为民，持续深化群众身边不正之风和腐败问题集中整治。推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">县</span></span>级主战场持续深化整治工作，发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">群众</span></span>监督作用，提升基层监督能力。", "ans": "县, 群众"}, {"id": 358, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[358]</span> 第五，强化政治巡视，增强巡视监督震慑力、穿透力、推动力。深化巡视巡察上下联动，加强对省区市<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、中央单位内部<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、对村<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡察</span></span>工作指导督导。第六，强化铁军意识，不断提高纪检监察工作规范化法治化正规化水平。", "ans": "巡视, 巡视, 巡察"}, {"id": 359, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[359]</span> 党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党、怎样建设长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。", "ans": "执政, 马克思主义, 执政, 马克思主义"}, {"id": 360, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[360]</span> 必须坚持投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物</span></span>和投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>紧密结合。", "ans": "物, 人"}, {"id": 361, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[361]</span> 一是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，建设强大国内市场；", "ans": "内需"}, {"id": 362, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[362]</span> 二是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>驱动，加紧培育壮大新动能；", "ans": "创新"}, {"id": 363, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[363]</span> 六是坚持“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">双碳</span></span>”引领，推动全面绿色转型；", "ans": "双碳"}, {"id": 364, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[364]</span> 七是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>为大，努力为人民群众多办实事；", "ans": "民生"}, {"id": 365, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[365]</span> 围绕做强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国内</span></span>大循环，拓展内需增长新空间；", "ans": "国内"}, {"id": 366, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[366]</span> 围绕发展新质生产力，推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>创新和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">产业</span></span>创新深度融合；", "ans": "科技, 产业"}, {"id": 367, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[367]</span> 国内生产总值增长 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">5</span></span>%，总量达到 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">140</span></span>.19 万亿元。实施学前<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>年免费教育政策、惠及 1400 万儿童，全面实施<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">育儿</span></span>补贴制度、惠及3000 多万婴幼儿。粮食产量达到 1.<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">4</span></span>3 万亿斤。", "ans": "5, 140, 一, 育儿, 4"}, {"id": 368, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[368]</span> 人工智能、生物医药、机器人、量子科技等研发应用走在世界前列，芯片自主研发有了新突破，天问<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">二</span></span>号开启“追星”之旅，北斗规模应用全面拓展，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">雅下</span></span>水电工程开工建设，首艘国产<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">电磁弹射型</span></span>航母<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">福建舰</span></span>正式入列，国产大模型引领全球开源生态。", "ans": "二, 雅下, 电磁弹射型, 福建舰"}, {"id": 369, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[369]</span> 国内生产总值连续跨越 110 万亿元、120 万亿元、130 万亿元、140 万亿元台阶，年均增长 5.4%、明显高于全球平均增速。全社会研发经费投入年均增长10%。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>增加值规模连续 16 年保持全球第一，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>领域外资准入限制措施全部取消。货物贸易第<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>大国地位更加巩固。森林覆盖率提高到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">25</span></span>%以上，成为全球森林资源增长最快最多的国家，构建起全球最大、发展最快的可再生能源体系。", "ans": "制造业, 制造业, 一, 25"}, {"id": 370, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[370]</span> 坚持稳中求进、提质增效，发挥存量政策和增量政策集成效应，加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">逆</span></span>周期和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">跨</span></span>周期调节力度，切实提升宏观经济治理效能。", "ans": "逆, 跨"}, {"id": 371, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[371]</span> 继续实施更加积极的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财政</span></span>政策。今年赤字率拟按4<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">%</span></span>左右安排，赤字规模比上年增加 2300 亿元。今年财政支出继续保持相当规模，要持续用力优化支出结构，更加注重支持提振消费、投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>、保障民生等方面，提高财政资金使用效益。中央财政<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">增加</span></span>对地方财力性转移支付规模，开展整合统筹使用转移支付资金试点，增强地方自主财力和统筹能力。各级政府要更好“当家理财”，建立健全增收节支机制，强化预算约束，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">严控</span></span>一般性支出，坚决落实过紧日子的要求。", "ans": "财政, %, 人, 增加, 严控"}, {"id": 372, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[372]</span> 继续实施适度宽松的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">货币</span></span>政策。把促进经济稳定增长、物价合理<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">回升</span></span>作为货币政策的重要考量，灵活高效运用<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>准<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>息等多种政策工具，保持流动性充裕，使社会融资规模、货币供应量增长同经济增长、价格总水平预期目标相匹配。畅通货币政策传导机制，引导金融机构加力支持扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>、科技创新、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中小微</span></span>企业等重点领域。规范信贷市场经营行为，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降低</span></span>融资中间费用，促进社会综合融资成本低位运行。", "ans": "货币, 回升, 降, 降, 内需, 中小微, 降低"}, {"id": 373, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[373]</span> 强化改革举措与宏观政策协同。增强宏观政策取向一致性和有效性，将各类经济政策和非经济政策、存量政策和增量政策纳入宏观政策取向<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一致性</span></span>评估。", "ans": "一致性"}, {"id": 374, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[374]</span> 着力建设强大国内市场。坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。", "ans": "内需"}, {"id": 375, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[375]</span> （1）深入实施提振消费专项行动。制定实施城乡居民增收计划，在促进低收入群体增收、增加居民<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财产性</span></span>收入、完善薪酬和社保制度等方面推出一批务实举措。促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">商品</span></span>消费扩容升级，支持消费品以旧换新，优化政策实施机制。扩大个人消费贷款和服务业经营主体贷款<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">贴</span></span>息政策支持领域，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>贴息上限，延长实施期限。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">有条件</span></span>的地方推广中小学春秋假，落实职工带薪错峰休假制度。", "ans": "财产性, 商品, 贴, 提高, 有条件"}, {"id": 376, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[376]</span> （2）充分挖掘释放有效投资潜力。增强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>主导的有效投资增长动力，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>类政府投资比重。单列并提高用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">项目</span></span>建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。", "ans": "市场, 民生, 项目"}, {"id": 377, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[377]</span> 2.加紧培育壮大新动能。坚持把发展经济的着力点放在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实体</span></span>经济上，因地制宜发展新质生产力，建设现代化产业体系。", "ans": "实体"}, {"id": 378, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[378]</span> （2）培育壮大新兴产业和未来产业。实施产业创新工程，鼓励<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">央企国企</span></span>带头开放应用场景，打造集成电路、航空航天、生物医药、低空经济等<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">新兴</span></span>支柱产业。建立未来产业投入增长和风险分担机制，培育发展未来能源、量子科技、生物制造、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">具身</span></span>智能、脑机接口、6G等未来产业。高效用好国家创业投资引导基金，大力发展创业投资、天使投资，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业。", "ans": "央企国企, 新兴, 具身, 政府"}, {"id": 379, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[379]</span> 加强原始创新和关键核心技术攻关。继续<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>基础研究投入比重，加大长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">稳定</span></span>支持。", "ans": "提高, 稳定"}, {"id": 380, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[380]</span> 推动科技创新和产业创新深度融合。建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地。强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">企业</span></span>创新主体地位，支持科技领军企业牵头组建创新联合体，提高承担国家重大科技项目比例。", "ans": "企业"}, {"id": 381, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[381]</span> 纵深推进全国统一大市场建设。完善统计、财税、考核等制度，规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">规范</span></span>税收优惠、财政补贴政策。加强反垄断、反不正当竞争，强化公平竞争审查<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">刚性</span></span>约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">整治</span></span>“内卷式”竞争，营造良好市场生态。深化要素<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场化</span></span>配置综合改革试点，将更多符合条件的地区纳入试点范围。", "ans": "规范, 刚性, 整治, 市场化"}, {"id": 382, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[382]</span> 推进财税金融体制改革。加大财政资源和预算统筹力度，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>国有资本收益收取比例。调整优化消费税征税范围、税率，并推进部分品目征收环节后移。规范金融机构竞争秩序，深入推进地方中小金融机构<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">减</span></span>量提质。持续深化资本市场投融资综合改革，进一步健全中长期资金入市机制，完善投资者保护制度，拓展私募股权和创投基金退出渠道，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">直接</span></span>融资、股权融资比重。", "ans": "提高, 减, 直接"}, {"id": 383, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[383]</span> 5.进一步扩大高水平对外开放。坚持合作共赢，稳步扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度型</span></span>开放，拓展国际循环，以开放促改革促发展。", "ans": "制度型"}, {"id": 384, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[384]</span> （1）积极扩大自主开放。以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">服务业</span></span>为重点扩大市场准入和开放领域，进一步扩大增值电信、生物技术、外商独资医院等领域开放试点，有序扩大数字领域开放，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">压减</span></span>跨境服务贸易负面清单。优化自由贸易试验区布局范围、提升创新引领发展能级，扎实推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">海南</span></span>自由贸易港建设。", "ans": "服务业, 压减, 海南"}, {"id": 385, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[385]</span> （3）扩大双向投资合作。深化外商投资促进体制机制改革，保障外资企业国民待遇，实施新版鼓励外商投资产业目录，促进外资境内再投资、扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">本地化</span></span>生产。", "ans": "本地化"}, {"id": 386, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[386]</span> （1）深入推进以人为本的新型城镇化。科学有序推进农业转移人口市民化，因地制宜放宽在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">流入地</span></span>参加中考报名条件，进一步完善“人地钱”挂钩政策。坚持城市内涵式发展，优化现代化城市体系。", "ans": "流入地"}, {"id": 387, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[387]</span> （2）不断增强区域发展协调性。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">京津冀</span></span>、长三角、粤港澳大湾区打造世界级城市群。加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差异化</span></span>政策支持力度，深入推进兴边富民行动，促进革命老区、民族地区、边疆地区、资源枯竭城市等振兴发展。", "ans": "京津冀, 差异化"}, {"id": 388, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[388]</span> （1）促进高质量充分就业。实施稳岗扩容提质行动，支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">劳动</span></span>密集型行业企业稳定岗位。", "ans": "劳动"}, {"id": 389, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[389]</span> （2）推动教育公平与质量提升。推动基础教育扩优提质，统筹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">义务</span></span>教育优质均衡发展、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">学前</span></span>教育优质普惠发展，完善免费学前教育政策，增加普通高中学位供给。", "ans": "义务, 学前"}, {"id": 390, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[390]</span> （3）强化基本医疗卫生服务。健全医疗、医保、医药<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">协同</span></span>发展和治理机制，深化以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>为导向的公立医院改革，加强县区、基层医疗机构运行保障。健全多层次医疗保障体系，稳步推动基本医疗保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">省级</span></span>统筹。", "ans": "协同, 公益性, 省级"}, {"id": 391, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[391]</span> （4）加强社会保障和服务。完善并落实基本养老保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全国</span></span>统筹制度，扩大失业、工伤保险覆盖面，稳妥有序推进职业伤害保障试点扩围，健全社保关系转移接续政策。加强初婚初育家庭住房保障，支持多子女家庭<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">改善性</span></span>住房需求。", "ans": "全国, 改善性"}, {"id": 392, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[392]</span> （1）着力稳定房地产市场。因城施策控增量、去库存、优供给，探索多渠道盘活存量商品房，鼓励收购存量商品房重点用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保障</span></span>性住房等。进一步发挥“保交房”的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">白</span></span>名单制度作用，防范债务违约风险。", "ans": "保障, 白"}, {"id": 393, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[393]</span> 到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2035</span></span>年建成健康中国，是中共中央作出的一项战略决策。“十五五”是实现这一目标的关键时期，我们必须统筹谋划、加紧推进，力求取得<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">决定性</span></span>进展。", "ans": "2035, 决定性"}, {"id": 394, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[394]</span> 第一，坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差距</span></span>仍然较大的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>，走中国特色卫生与健康发展道路。", "ans": "差距, 公益性"}, {"id": 395, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[395]</span> 中共中央明确提出新时代卫生与健康工作方针，即以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基层</span></span>为重点，以改革创新为动力，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">预防</span></span>为主，中西医并重，把健康融入所有政策，人民共建共享。", "ans": "基层, 预防"}, {"id": 396, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[396]</span> 第二，突出重点推进健康中国建设。要继续优化体系布局，实施医疗卫生强基工程，促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">分级</span></span>诊疗，加强县区和基层医疗卫生机构运行保障。", "ans": "分级"}, {"id": 397, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[397]</span> 第三，为健康中国建设提供有力保障。要健全党委统一领导、党政齐抓共管的工作格局，将健康理念融入公共政策制定实施的全过程。要深化公立医院改革和医保支付方式改革，健全药品价格形成机制、优化药品和医用耗材<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">集中</span></span>采购政策，提高医保资金使用效率，完善医疗、医保、医药协同发展和治理机制。", "ans": "集中"}, {"id": 398, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[398]</span> 2025 年，党中央深入推进党风廉政建设和反腐败斗争，取得显著成效。强化政治监督，深化政治巡视，有力保障党中央重大决策部署贯彻落实；扎实开展深入贯彻<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中央八项规定</span></span>精神学习教育，推动全党进一步改作风树新风；保持反腐败高压态势，推进风腐同查同治，深化整治群众身边不正之风和腐败问题，着力铲除腐败滋生的土壤和条件。", "ans": "中央八项规定"}, {"id": 399, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[399]</span> 深刻把握实现“十五五”时期目标任务对把权力关进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>笼子提出的更高要求，坚定不移强化制度治权、依规用权；", "ans": "制度"}, {"id": 400, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[400]</span> 第一，强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>监督，推动全党凝心聚力实现“十五五”时期目标任务。", "ans": "政治"}, {"id": 401, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[401]</span> 第二，强化正风肃纪，巩固拓展深入贯彻中央八项规定精神学习教育成果。持续狠刹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">享乐</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">奢靡</span></span>之风，对违规吃喝、违规收送礼品礼金等易发多发问题深化整治；对以调研考察、开展党建活动、培训的名义搞公款旅游，变相公款出国（境）旅游等问题严肃查处；对借民生项目违规建设楼堂馆所等新动向密切关注并纠治。持续整治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">形式</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">官僚</span></span>主义，坚决纠治临近换届等待观望不作为，换届后急功近利“翻烧饼”、搞“政绩工程”等突出问题，推动为基层减负。", "ans": "享乐, 奢靡, 形式, 官僚"}, {"id": 402, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[402]</span> 第三，强化标本兼治，用好一体推进不敢腐、不能腐、不想腐战略抓手。以保持高压震慑强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不敢</span></span>腐，坚持猛药去疴、重典治乱。以加强监督制约强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不能</span></span>腐，健全授权用权制权相统一、清晰透明可追溯的制度机制。以深化廉洁教育强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不想</span></span>腐，不断塑造清正廉洁的思想品格、廉洁奉公的政德修养、廉洁自律的道德操守、崇廉拒腐的社会风尚。以完善体制机制促进一体推进，健全党委统一领导下的反腐败工作机制。", "ans": "不敢, 不能, 不想"}, {"id": 403, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[403]</span> 第四，强化执纪执法为民，持续深化群众身边不正之风和腐败问题集中整治。推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">县</span></span>级主战场持续深化整治工作，发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">群众</span></span>监督作用，提升基层监督能力。", "ans": "县, 群众"}, {"id": 404, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[404]</span> 第五，强化政治巡视，增强巡视监督震慑力、穿透力、推动力。深化巡视巡察上下联动，加强对省区市<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、中央单位内部<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡视</span></span>、对村<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巡察</span></span>工作指导督导。第六，强化铁军意识，不断提高纪检监察工作规范化法治化正规化水平。", "ans": "巡视, 巡视, 巡察"}, {"id": 405, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[405]</span> 党的十八大以来，以习近平同志为核心的党中央围绕建设什么样的长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党、怎样建设长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>政党的重大时代课题，提出一系列新理念新思想新战略，形成习近平党建思想。", "ans": "执政, 马克思主义, 执政, 马克思主义"}, {"id": 406, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[406]</span> 必须坚持投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物</span></span>和投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>紧密结合。", "ans": "物, 人"}, {"id": 407, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[407]</span> 一是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，建设强大国内市场；", "ans": "内需"}, {"id": 408, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[408]</span> 二是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>驱动，加紧培育壮大新动能；", "ans": "创新"}, {"id": 409, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[409]</span> 六是坚持“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">双碳</span></span>”引领，推动全面绿色转型；", "ans": "双碳"}, {"id": 410, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[410]</span> 七是坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>为大，努力为人民群众多办实事；", "ans": "民生"}, {"id": 411, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[411]</span> 围绕做强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国内</span></span>大循环，拓展内需增长新空间；", "ans": "国内"}, {"id": 412, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[412]</span> 围绕发展新质生产力，推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>创新和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">产业</span></span>创新深度融合；", "ans": "科技, 产业"}, {"id": 413, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[413]</span> 国内生产总值增长 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">5</span></span>%，总量达到 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">140</span></span>.19 万亿元。实施学前<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>年免费教育政策、惠及 1400 万儿童，全面实施<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">育儿</span></span>补贴制度、惠及3000 多万婴幼儿。粮食产量达到 1.<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">4</span></span>3 万亿斤。", "ans": "5, 140, 一, 育儿, 4"}, {"id": 414, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[414]</span> 人工智能、生物医药、机器人、量子科技等研发应用走在世界前列，芯片自主研发有了新突破，天问<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">二</span></span>号开启“追星”之旅，北斗规模应用全面拓展，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">雅下</span></span>水电工程开工建设，首艘国产<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">电磁弹射型</span></span>航母<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">福建舰</span></span>正式入列，国产大模型引领全球开源生态。", "ans": "二, 雅下, 电磁弹射型, 福建舰"}, {"id": 415, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[415]</span> 国内生产总值连续跨越 110 万亿元、120 万亿元、130 万亿元、140 万亿元台阶，年均增长 5.4%、明显高于全球平均增速。全社会研发经费投入年均增长10%。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>增加值规模连续 16 年保持全球第一，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制造业</span></span>领域外资准入限制措施全部取消。货物贸易第<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一</span></span>大国地位更加巩固。森林覆盖率提高到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">25</span></span>%以上，成为全球森林资源增长最快最多的国家，构建起全球最大、发展最快的可再生能源体系。", "ans": "制造业, 制造业, 一, 25"}, {"id": 416, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[416]</span> 坚持稳中求进、提质增效，发挥存量政策和增量政策集成效应，加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">逆</span></span>周期和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">跨</span></span>周期调节力度，切实提升宏观经济治理效能。", "ans": "逆, 跨"}, {"id": 417, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[417]</span> 继续实施更加积极的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财政</span></span>政策。今年赤字率拟按4<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">%</span></span>左右安排，赤字规模比上年增加 2300 亿元。今年财政支出继续保持相当规模，要持续用力优化支出结构，更加注重支持提振消费、投资于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>、保障民生等方面，提高财政资金使用效益。中央财政<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">增加</span></span>对地方财力性转移支付规模，开展整合统筹使用转移支付资金试点，增强地方自主财力和统筹能力。各级政府要更好“当家理财”，建立健全增收节支机制，强化预算约束，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">严控</span></span>一般性支出，坚决落实过紧日子的要求。", "ans": "财政, %, 人, 增加, 严控"}, {"id": 418, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[418]</span> 继续实施适度宽松的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">货币</span></span>政策。把促进经济稳定增长、物价合理<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">回升</span></span>作为货币政策的重要考量，灵活高效运用<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>准<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降</span></span>息等多种政策工具，保持流动性充裕，使社会融资规模、货币供应量增长同经济增长、价格总水平预期目标相匹配。畅通货币政策传导机制，引导金融机构加力支持扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>、科技创新、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中小微</span></span>企业等重点领域。规范信贷市场经营行为，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">降低</span></span>融资中间费用，促进社会综合融资成本低位运行。", "ans": "货币, 回升, 降, 降, 内需, 中小微, 降低"}, {"id": 419, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[419]</span> 强化改革举措与宏观政策协同。增强宏观政策取向一致性和有效性，将各类经济政策和非经济政策、存量政策和增量政策纳入宏观政策取向<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一致性</span></span>评估。", "ans": "一致性"}, {"id": 420, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[420]</span> 着力建设强大国内市场。坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内需</span></span>主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。", "ans": "内需"}, {"id": 421, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[421]</span> （1）深入实施提振消费专项行动。制定实施城乡居民增收计划，在促进低收入群体增收、增加居民<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">财产性</span></span>收入、完善薪酬和社保制度等方面推出一批务实举措。促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">商品</span></span>消费扩容升级，支持消费品以旧换新，优化政策实施机制。扩大个人消费贷款和服务业经营主体贷款<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">贴</span></span>息政策支持领域，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>贴息上限，延长实施期限。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">有条件</span></span>的地方推广中小学春秋假，落实职工带薪错峰休假制度。", "ans": "财产性, 商品, 贴, 提高, 有条件"}, {"id": 422, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[422]</span> （2）充分挖掘释放有效投资潜力。增强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>主导的有效投资增长动力，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民生</span></span>类政府投资比重。单列并提高用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">项目</span></span>建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。", "ans": "市场, 民生, 项目"}, {"id": 423, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[423]</span> 2.加紧培育壮大新动能。坚持把发展经济的着力点放在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实体</span></span>经济上，因地制宜发展新质生产力，建设现代化产业体系。", "ans": "实体"}, {"id": 424, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[424]</span> （2）培育壮大新兴产业和未来产业。实施产业创新工程，鼓励<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">央企国企</span></span>带头开放应用场景，打造集成电路、航空航天、生物医药、低空经济等<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">新兴</span></span>支柱产业。建立未来产业投入增长和风险分担机制，培育发展未来能源、量子科技、生物制造、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">具身</span></span>智能、脑机接口、6G等未来产业。高效用好国家创业投资引导基金，大力发展创业投资、天使投资，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业。", "ans": "央企国企, 新兴, 具身, 政府"}, {"id": 425, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[425]</span> 加强原始创新和关键核心技术攻关。继续<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>基础研究投入比重，加大长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">稳定</span></span>支持。", "ans": "提高, 稳定"}, {"id": 426, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[426]</span> 推动科技创新和产业创新深度融合。建设北京（京津冀）、上海（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地。强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">企业</span></span>创新主体地位，支持科技领军企业牵头组建创新联合体，提高承担国家重大科技项目比例。", "ans": "企业"}, {"id": 427, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[427]</span> 纵深推进全国统一大市场建设。完善统计、财税、考核等制度，规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">规范</span></span>税收优惠、财政补贴政策。加强反垄断、反不正当竞争，强化公平竞争审查<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">刚性</span></span>约束，综合运用产能调控、标准引领、价格执法、质量监管等手段，深入<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">整治</span></span>“内卷式”竞争，营造良好市场生态。深化要素<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场化</span></span>配置综合改革试点，将更多符合条件的地区纳入试点范围。", "ans": "规范, 刚性, 整治, 市场化"}, {"id": 428, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[428]</span> 推进财税金融体制改革。加大财政资源和预算统筹力度，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">提高</span></span>国有资本收益收取比例。调整优化消费税征税范围、税率，并推进部分品目征收环节后移。规范金融机构竞争秩序，深入推进地方中小金融机构<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">减</span></span>量提质。持续深化资本市场投融资综合改革，进一步健全中长期资金入市机制，完善投资者保护制度，拓展私募股权和创投基金退出渠道，提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">直接</span></span>融资、股权融资比重。", "ans": "提高, 减, 直接"}, {"id": 429, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[429]</span> 5.进一步扩大高水平对外开放。坚持合作共赢，稳步扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度型</span></span>开放，拓展国际循环，以开放促改革促发展。", "ans": "制度型"}, {"id": 430, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[430]</span> （1）积极扩大自主开放。以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">服务业</span></span>为重点扩大市场准入和开放领域，进一步扩大增值电信、生物技术、外商独资医院等领域开放试点，有序扩大数字领域开放，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">压减</span></span>跨境服务贸易负面清单。优化自由贸易试验区布局范围、提升创新引领发展能级，扎实推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">海南</span></span>自由贸易港建设。", "ans": "服务业, 压减, 海南"}, {"id": 431, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[431]</span> （3）扩大双向投资合作。深化外商投资促进体制机制改革，保障外资企业国民待遇，实施新版鼓励外商投资产业目录，促进外资境内再投资、扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">本地化</span></span>生产。", "ans": "本地化"}, {"id": 432, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[432]</span> （1）深入推进以人为本的新型城镇化。科学有序推进农业转移人口市民化，因地制宜放宽在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">流入地</span></span>参加中考报名条件，进一步完善“人地钱”挂钩政策。坚持城市内涵式发展，优化现代化城市体系。", "ans": "流入地"}, {"id": 433, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[433]</span> （2）不断增强区域发展协调性。支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">京津冀</span></span>、长三角、粤港澳大湾区打造世界级城市群。加大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差异化</span></span>政策支持力度，深入推进兴边富民行动，促进革命老区、民族地区、边疆地区、资源枯竭城市等振兴发展。", "ans": "京津冀, 差异化"}, {"id": 434, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[434]</span> （1）促进高质量充分就业。实施稳岗扩容提质行动，支持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">劳动</span></span>密集型行业企业稳定岗位。", "ans": "劳动"}, {"id": 435, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[435]</span> （2）推动教育公平与质量提升。推动基础教育扩优提质，统筹<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">义务</span></span>教育优质均衡发展、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">学前</span></span>教育优质普惠发展，完善免费学前教育政策，增加普通高中学位供给。", "ans": "义务, 学前"}, {"id": 436, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[436]</span> （3）强化基本医疗卫生服务。健全医疗、医保、医药<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">协同</span></span>发展和治理机制，深化以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>为导向的公立医院改革，加强县区、基层医疗机构运行保障。健全多层次医疗保障体系，稳步推动基本医疗保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">省级</span></span>统筹。", "ans": "协同, 公益性, 省级"}, {"id": 437, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[437]</span> （4）加强社会保障和服务。完善并落实基本养老保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全国</span></span>统筹制度，扩大失业、工伤保险覆盖面，稳妥有序推进职业伤害保障试点扩围，健全社保关系转移接续政策。加强初婚初育家庭住房保障，支持多子女家庭<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">改善性</span></span>住房需求。", "ans": "全国, 改善性"}, {"id": 438, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[438]</span> （1）着力稳定房地产市场。因城施策控增量、去库存、优供给，探索多渠道盘活存量商品房，鼓励收购存量商品房重点用于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保障</span></span>性住房等。进一步发挥“保交房”的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">白</span></span>名单制度作用，防范债务违约风险。", "ans": "保障, 白"}, {"id": 439, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[439]</span> 到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2035</span></span>年建成健康中国，是中共中央作出的一项战略决策。“十五五”是实现这一目标的关键时期，我们必须统筹谋划、加紧推进，力求取得<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">决定性</span></span>进展。", "ans": "2035, 决定性"}, {"id": 440, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[440]</span> 第一，坚持从我国国情出发推动卫生与健康事业发展。我国是社会主义国家，是人口规模巨大、城乡区域<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">差距</span></span>仍然较大的发展中国家，这决定我们必须坚持党对卫生与健康工作的领导，坚持人民至上、生命至上，坚持健康优先发展战略，坚持基本医疗卫生事业的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益性</span></span>，走中国特色卫生与健康发展道路。", "ans": "差距, 公益性"}, {"id": 441, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[441]</span> 中共中央明确提出新时代卫生与健康工作方针，即以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基层</span></span>为重点，以改革创新为动力，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">预防</span></span>为主，中西医并重，把健康融入所有政策，人民共建共享。", "ans": "基层, 预防"}, {"id": 442, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[442]</span> 第二，突出重点推进健康中国建设。要继续优化体系布局，实施医疗卫生强基工程，促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">分级</span></span>诊疗，加强县区和基层医疗卫生机构运行保障。", "ans": "分级"}, {"id": 443, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[443]</span> 第三，为健康中国建设提供有力保障。要健全党委统一领导、党政齐抓共管的工作格局，将健康理念融入公共政策制定实施的全过程。要深化公立医院改革和医保支付方式改革，健全药品价格形成机制、优化药品和医用耗材<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">集中</span></span>采购政策，提高医保资金使用效率，完善医疗、医保、医药协同发展和治理机制。", "ans": "集中"}, {"id": 444, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[444]</span> 2025 年，党中央深入推进党风廉政建设和反腐败斗争，取得显著成效。强化政治监督，深化政治巡视，有力保障党中央重大决策部署贯彻落实；扎实开展深入贯彻<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中央八项规定</span></span>精神学习教育，推动全党进一步改作风树新风；保持反腐败高压态势，推进风腐同查同治，深化整治群众身边不正之风和腐败问题，着力铲除腐败滋生的土壤和条件。", "ans": "中央八项规定"}, {"id": 445, "cat": "时事政治", "html": "<span style=\"color:#f59e0b; font-weight:bold;\">[445]</span>
