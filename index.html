<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>政治理论全量题库背诵系统 (精准474题版)</title>
    <style>
        :root { --page-bg: #f8fafc; --btn-bg: #4f46e5; --text-color: #1e293b; --wrong: #ef4444; --exit-color: #64748b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--page-bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; color: var(--text-color); }
        .container { background: #ffffff; width: 100%; max-width: 650px; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); text-align: center; margin-top: 10px; position: relative; border: 1px solid #e2e8f0; }
        .hidden { display: none !important; }
        .btn-exit { position: absolute; top: 18px; left: 18px; border: 1px solid #cbd5e1; color: var(--exit-color); background: #ffffff; padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 500; }
        .menu-grid { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { width: 100%; background: var(--btn-bg); color: #ffffff; border: none; padding: 14px; font-size: 1rem; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .btn-cat { background: #e0e7ff; color: #3730a3; font-size: 0.9rem; padding: 10px; }
        .grade-box { font-size: 0.85rem; color: #475569; margin: 10px 0; padding: 10px 14px; background: #f1f5f9; border-radius: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .question { font-size: 1.1rem; font-weight: 600; margin: 20px 0; word-break: break-all; text-align: left; line-height: 1.7; max-height: 300px; overflow-y: auto; padding-right: 8px; color: #0f172a; }
        
        /* 挖空与红色答案样式 */
        .blank-space { display: inline-block; border-bottom: 2px solid #ef4444; min-width: 50px; padding: 0 4px; color: #ef4444; font-weight: 700; text-align: center; margin: 0 2px; }
        .answer-hidden { color: transparent !important; background-color: #fee2e2; border-radius: 4px; padding: 0 4px; user-select: none; }
        .answer-show { color: #ef4444 !important; background-color: #fee2e2; border-radius: 4px; padding: 0 4px; transition: color 0.2s ease-in; }

        .history-title { padding: 12px; color: #4f46e5; cursor: pointer; border-bottom: 1px dashed #cbd5e1; font-weight: 600; font-size: 0.9rem; }
        #history-list { display: none; max-height: 180px; overflow-y: auto; text-align: left; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; word-break: break-all; }
        th { background: #f8fafc; font-weight: 600; }
    </style>
</head>
<body>

<!-- 首页设置面板 -->
<div id="setup-screen" class="container">
    <h2 style="margin-bottom: 5px; color: #1e1b4b;">政治理论全量题库背诵系统</h2>
    <p style="color: #64748b; font-size: 0.85rem; margin-top: 0;">精准收录原 Word 474 题 (习思想 1-205 | 马哲 206-267 | 时政 268-474)</p>
    
    <div style="text-align:left; font-size:0.85rem; font-weight:bold; color:#475569; margin-top:15px; margin-bottom:6px;">分板块专题背诵：</div>
    <div class="cat-grid">
        <button class="btn-cat" onclick="startQuiz('cat', '习思想')">习思想<br><span style="font-size:0.75rem; font-weight:normal;">(1-205题)</span></button>
        <button class="btn-cat" onclick="startQuiz('cat', '马哲')" style="background:#dcfce7; color:#166534;">马克思主义哲学<br><span style="font-size:0.75rem; font-weight:normal;">(206-267题)</span></button>
        <button class="btn-cat" onclick="startQuiz('cat', '时事政治')" style="background:#fef3c7; color:#92400e;">时事政治<br><span style="font-size:0.75rem; font-weight:normal;">(268-474题)</span></button>
    </div>

    <div style="text-align:left; font-size:0.85rem; font-weight:bold; color:#475569; margin-top:15px; margin-bottom:6px;">全库抽题练习：</div>
    <div class="menu-grid">
        <button onclick="startQuiz(10)">10 题快速挑战</button>
        <button onclick="startQuiz(30)">30 题强化练习</button>
        <button onclick="startQuiz(50)">50 题标准挑战</button>
        <button style="background: #10b981;" onclick="startQuiz('all')">🔥 全部 474 题顺序通关背诵</button>
    </div>

    <div id="history-section">
        <div class="history-title" onclick="toggleHistory()">🕒 最近背诵记录 (点击展开)</div>
        <div id="history-list"></div>
        <button style="background:none; color:#ef4444; border:1px solid #fca5a5; margin-top:10px; padding:8px; font-size:0.8rem;" onclick="clearHistory()">清空背诵历史</button>
    </div>
</div>

<!-- 做题主页面 -->
<div id="game-screen" class="container hidden">
    <button class="btn-exit" onclick="returnToHome()">退出</button>
    <div id="timer" style="margin-top:25px; font-weight:bold; color:#64748b; font-size:0.9rem;">00:00</div>
    <div class="grade-box">
        <span id="grade-standards">当前进度: 1/474</span>
        <span id="cat-tag" style="background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:6px; font-weight:bold;">习思想</span>
    </div>
    <div class="question" id="q-val">加载中...</div>
    
    <div style="display:flex; gap:12px; margin-top: 20px;">
        <button style="background:#f59e0b; color:#ffffff;" onclick="revealAnswer()">看答案</button>
        <button onclick="nextStep()">认识/下一个</button>
    </div>
</div>

<!-- 结果结算页面 -->
<div id="result-screen" class="container hidden">
    <h2>背诵完成 🎉</h2>
    <p>本次练习题数：<span id="res-count" style="font-weight:bold; color:#4f46e5;"></span></p>
    <p>总用时：<span id="res-time" style="font-weight:bold; color:#10b981;"></span></p>
    <button onclick="returnToHome()" style="margin-bottom: 15px;">返回首页</button>
    <div style="max-height: 280px; overflow-y: auto;">
        <table id="res-table">
            <thead><tr><th style="width:70%;">题目内容</th><th style="width:30%;">正确答案</th></tr></thead>
            <tbody id="res-body"></tbody>
        </table>
    </div>
</div>

<script>
    const questionDatabase = [{"id": 1, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[1]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">坚持和发展中国特色社会主义</span></span>，是改革开放以来我们党全部理论和实践的鲜明主题，也是习近平新时代中国特色社会主义思想的核心要义。", "ans": "坚持和发展中国特色社会主义"}, {"id": 2, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[2]</span> 党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十八大</span></span>以来，党中央领导全党全国各族人民开创了中国特色社会主义新时代。党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十九大</span></span>作出中国特色社会主义进入新时代这个重大政治论断。", "ans": "十八大, 十九大"}, {"id": 3, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[3]</span> 我国社会<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主要矛盾</span></span>的变化是我们党作出中国特色社会主义进入新时代重大判断的基本依据。党的十九大报告指出，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不平衡不充分</span></span>的发展之间的矛盾。", "ans": "主要矛盾, 不平衡不充分"}, {"id": 4, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[4]</span> 新时代我国社会主要矛盾的变化，没有改变对我国社会主义所处历史阶段的判断。我国仍处于并将长期处于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社会主义初级阶段</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本国情</span></span>没有变，我国是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">世界最大发展中国家</span></span>的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国际地位</span></span>没有变。", "ans": "社会主义初级阶段, 基本国情, 世界最大发展中国家, 国际地位"}, {"id": 5, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[5]</span> 习近平新时代中国特色社会主义思想是坚持“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">两个结合</span></span>”的重大成果和光辉典范。“两个结合”是指要把马克思主义基本原理同<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中国具体实际</span></span>相结合、同<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中华优秀传统文化</span></span>相结合。“两个结合”是对坚持和发展马克思主义作出的重大理论贡献，是我们取得成功的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">最大法宝</span></span>。", "ans": "两个结合, 中国具体实际, 中华优秀传统文化, 最大法宝"}, {"id": 6, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[6]</span> 习近平总书记在强调坚持“第一个结合”的基础上，明确提出把马克思主义基本原理同<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中华优秀传统文化</span></span>相结合的重大命题，这是又一次的思想解放。", "ans": "中华优秀传统文化"}, {"id": 7, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[7]</span> 习近平新时代中国特色社会主义思想使<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>这个魂脉和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中华优秀传统文化</span></span>这个根脉内在贯通、相互成就，是中华文化和中国精神的时代精华。", "ans": "马克思主义, 中华优秀传统文化"}, {"id": 8, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[8]</span> 习近平新时代中国特色社会主义思想，科学回答了新时代坚持和发展什么样的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中国特色社会主义</span></span>、怎样坚持和发展<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中国特色社会主义</span></span>，建设什么样的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社会主义现代化强国</span></span>、怎样建设<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社会主义现代化强国</span></span>，建设什么样的长期执政的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义政党</span></span>、怎样建设长期执政的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义政党</span></span>等重大时代课题，形成了完整的科学体系。", "ans": "中国特色社会主义, 中国特色社会主义, 社会主义现代化强国, 社会主义现代化强国, 马克思主义政党, 马克思主义政党"}, {"id": 9, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[9]</span> 党的十九大、十九届六中全会提出的“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十</span></span>个明确”“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十四</span></span>个坚持”“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十三</span></span>个方面成就”概括了习近平新时代中国特色社会主义思想的主要内容。党的二十大提出的“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">六</span></span>个必须坚持”，是习近平新时代中国特色社会主义思想的世界观、方法论。“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十</span></span>个明确”“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十四</span></span>个坚持”“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十三</span></span>个方面成就”“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">六</span></span>个必须坚持”内在贯通、有机统一，共同构成了习近平新时代中国特色社会主义思想的科学体系。", "ans": "十, 十四, 十三, 六, 十, 十四, 十三, 六"}, {"id": 10, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[10]</span> “十个明确”是习近平新时代中国特色社会主义思想<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主体</span></span>内容，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着统摄作用。", "ans": "主体"}, {"id": 11, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[11]</span> 1. 明确中国特色社会主义最本质的特征是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中国共产党领导</span></span>，中国特色社会主义制度的最大优势是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中国共产党领导</span></span>，中国共产党是最高政治领导力量，全党必须增强“四个意识”、坚定“四个自信”、做到“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">两</span></span>个维护”。", "ans": "中国共产党领导, 中国共产党领导, 两"}, {"id": 12, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[12]</span> 2. 明确坚持和发展中国特色社会主义，总任务是实现<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社会主义现代化</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中华民族伟大复兴</span></span>，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴。", "ans": "社会主义现代化, 中华民族伟大复兴"}, {"id": 13, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[13]</span> 3. 明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民</span></span>为中心的发展思想，发展全过程人民民主，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。", "ans": "人民"}, {"id": 14, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[14]</span> 4. 明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，战略布局是全面建设社会主义现代化国家、全面<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">深化改革</span></span>、全面<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">依法治国</span></span>、全面<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">从严治党</span></span>四个全面。", "ans": "深化改革, 依法治国, 从严治党"}, {"id": 15, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[15]</span> 5. 明确全面深化改革总目标是完善和发展中国特色社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>、推进国家<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">治理</span></span>体系和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">治理</span></span>能力现代化。", "ans": "制度, 治理, 治理"}, {"id": 16, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[16]</span> 6. 明确全面推进依法治国总目标是建设中国特色社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">法治体系</span></span>、建设社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">法治国家</span></span>。", "ans": "法治体系, 法治国家"}, {"id": 17, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[17]</span> 7. 明确必须坚持和完善社会主义基本<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">经济</span></span>制度，使<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>在资源配置中起决定性作用，更好发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全。", "ans": "经济, 市场, 政府"}, {"id": 18, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[18]</span> 8. 明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">作风</span></span>优良的人民军队，把人民军队建设成为世界一流军队。", "ans": "作风"}, {"id": 19, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[19]</span> 9. 明确中国特色大国外交要服务民族复兴、促进人类进步，推动建设新型国际关系，推动构建<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人类命运共同体</span></span>。", "ans": "人类命运共同体"}, {"id": 20, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[20]</span> 10. 明确全面从严治党的战略方针，提出新时代党的建设总要求，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>建设贯穿其中，深入推进反腐败斗争，落实管党治党政治责任，以伟大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自我</span></span>革命引领<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">伟大</span></span>社会革命。", "ans": "制度, 自我, 伟大"}, {"id": 21, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[21]</span> “六个必须坚持”是习近平新时代中国特色社会主义思想的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">世界观</span></span>、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">方法论</span></span>和贯穿其中的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">立场观点方法</span></span>的重要体现。", "ans": "世界观, 方法论, 立场观点方法"}, {"id": 22, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[22]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民至上</span></span>是根本价值立场，体现了历史唯物主义群众史观；", "ans": "人民至上"}, {"id": 23, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[23]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自信自立</span></span>是内在精神特质，体现了客观规律性和主观能动性的有机结合；", "ans": "自信自立"}, {"id": 24, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[24]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">守正创新</span></span>是鲜明理论品格，体现了变与不变、继承与发展的内在联系；", "ans": "守正创新"}, {"id": 25, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[25]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">问题导向</span></span>是重要实践要求，体现了矛盾的普遍性和客观性；", "ans": "问题导向"}, {"id": 26, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[26]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">系统观念</span></span>是基本思想和工作方法，体现了辩证唯物主义普遍联系的原理；", "ans": "系统观念"}, {"id": 27, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[27]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">胸怀天下</span></span>是中国共产党人的境界格局，体现了马克思主义追求人类进步和解放的崇高理想。", "ans": "胸怀天下"}, {"id": 28, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[28]</span> 党的二十大报告指出，中国共产党的中心任务是团结带领全国各族人民全面建成社会主义现代化强国、实现第<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">二</span></span>个百年奋斗目标，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中国式现代化</span></span>全面推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中华民族伟大复兴</span></span>。", "ans": "二, 中国式现代化, 中华民族伟大复兴"}, {"id": 29, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[29]</span> 中华民族<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">近代</span></span>以来最伟大的梦想：实现中华民族伟大复兴。", "ans": "近代"}, {"id": 30, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[30]</span> 中国梦的实现途径：走中国道路、弘扬中国精神、凝聚中国力量。中国道路：中国特色社会主义道路。中国精神：以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">爱国主义</span></span>为核心的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民族</span></span>精神和以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">改革创新</span></span>为核心的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">时代</span></span>精神。中国力量：全国各族人民大团结的力量。", "ans": "爱国主义, 民族, 改革创新, 时代"}, {"id": 31, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[31]</span> 党的二十大明确，全面建成社会主义现代化强国总的战略安排是分两步走：从<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2020</span></span>年到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2035</span></span>年<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>实现社会主义现代化；从<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2035</span></span>年到本世纪<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中叶</span></span>，把我国<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">建成</span></span>富强民主文明和谐美丽的社会主义现代化强国。", "ans": "2020, 2035, 基本, 2035, 中叶, 建成"}, {"id": 32, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[32]</span> 人均国内生产总值迈上新的大台阶，达到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中等发达</span></span>国家水平。", "ans": "中等发达"}, {"id": 33, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[33]</span> 实现高水平科技自立自强，进入创新型国家<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">前</span></span>列。", "ans": "前"}, {"id": 34, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[34]</span> 建成现代化经济体系，形成新发展格局。建成<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>强国、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">教育</span></span>强国、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">文化</span></span>强国、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">健康</span></span>强国、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">体育</span></span>强国、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人才</span></span>强国。", "ans": "科技, 教育, 文化, 健康, 体育, 人才"}, {"id": 35, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[35]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>实现国家治理体系和治理能力现代化，全过程人民民主制度更加健全，基本建成法治国家、法治政府、法治社会。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>实现新型工业化、信息化、城镇化、农业现代化。碳排放<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">达峰后</span></span>稳中有降，生态环境根本好转，美丽中国目标<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>实现。国家安全体系和能力全面加强，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>实现国防和军队现代化。", "ans": "基本, 基本, 达峰后, 基本, 基本"}, {"id": 36, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[36]</span> 人民生活更加幸福美好，人的全面发展、全体人民共同富裕取得更为明显的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实质性进展</span></span>。", "ans": "实质性进展"}, {"id": 37, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[37]</span> 第二步，到本世纪中叶，把我国建设成为富强民主文明和谐美丽的社会主义现代化强国。我国物质文明、政治文明、精神文明、社会文明、生态文明将<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全面</span></span>提升，全体人民共同富裕<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本实现</span></span>。", "ans": "全面, 基本实现"}, {"id": 38, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[38]</span> 中国式现代化是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人口规模</span></span>巨大的现代化。 ", "ans": "人口规模"}, {"id": 39, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[39]</span> 中国式现代化是全体人民<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">共同富裕</span></span>的现代化。", "ans": "共同富裕"}, {"id": 40, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[40]</span> 中国式现代化是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物质文明</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">精神文明</span></span>相协调的现代化。 ", "ans": "物质文明, 精神文明"}, {"id": 41, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[41]</span> 中国式现代化是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人与自然和谐共生</span></span>的现代化。 ", "ans": "人与自然和谐共生"}, {"id": 42, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[42]</span> 中国式现代化是走<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">和平发展</span></span>道路的现代化。", "ans": "和平发展"}, {"id": 43, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[43]</span> 坚持中国共产党领导，坚持中国特色社会主义，实现<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">高质量发展</span></span>，发展<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全过程人民民主</span></span>，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">命运共同体</span></span>，创造人类<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">文明新形态</span></span>。 ", "ans": "高质量发展, 全过程人民民主, 命运共同体, 文明新形态"}, {"id": 44, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[44]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党的领导</span></span>直接关系中国式现代化的根本方向、前途命运、最终成败。", "ans": "党的领导"}, {"id": 45, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[45]</span> 党的领导制度是我国的根本<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">领导</span></span>制度。", "ans": "领导"}, {"id": 46, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[46]</span> 党的领导制度在中国特色社会主义制度体系中居于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">统领</span></span>地位，是中国特色社会主义制度体系的核心，是中国特色社会主义制度建设的关键，也是国家治理体系和治理能力现代化的关键。", "ans": "统领"}, {"id": 47, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[47]</span> 1. 坚持人民至上，是新时代党治国理政的根本<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">价值</span></span>取向。", "ans": "价值"}, {"id": 48, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[48]</span> 2. 人民立场是党的根本政治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">立场</span></span>，是我党区别于其他政党的显著标志。", "ans": "立场"}, {"id": 49, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[49]</span> 3. 增进民生福祉是发展的根本<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">目的</span></span>。", "ans": "目的"}, {"id": 50, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[50]</span> 4. 满足人民日益增长的美好生活需要是发展的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">出发点</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">落脚点</span></span>。", "ans": "出发点, 落脚点"}, {"id": 51, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[51]</span> 5. 全心全意为人民服务是党的根本<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">宗旨</span></span>。", "ans": "宗旨"}, {"id": 52, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[52]</span> 6. <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">为民造福</span></span>是党的最大政绩。", "ans": "为民造福"}, {"id": 53, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[53]</span> 共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">平均</span></span>主义，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不是</span></span>所有人都同时富裕，也<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不是</span></span>所有地区同时达到一个富裕水准。", "ans": "平均, 不是, 不是"}, {"id": 54, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[54]</span> 实现共同富裕，首先要把“蛋糕”<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">做大做好</span></span>，然后把“蛋糕”<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">切好分好</span></span>。", "ans": "做大做好, 切好分好"}, {"id": 55, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[55]</span> 扩大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中等</span></span>收入群体比重，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">增加</span></span>低收入群体收入，合理<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">调节</span></span>高收入，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">取缔</span></span>非法收入，形成中间大、两头小的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">橄榄</span></span>型分配结构。", "ans": "中等, 增加, 调节, 取缔, 橄榄"}, {"id": 56, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[56]</span> 高质量发展是全面建设社会主义现代化国家的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">首要任务</span></span>，是我国经济社会发展的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主题</span></span>。", "ans": "首要任务, 主题"}, {"id": 57, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[57]</span> 新发展阶段是我国社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">初级</span></span>阶段历史进程中的一个重要阶段。", "ans": "初级"}, {"id": 58, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[58]</span> 新发展阶段是全面建成<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">小康社会</span></span>、实现第一个百年奋斗目标之后，全面建设<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社会主义现代化国家</span></span>、向第二个百年奋斗目标进军的重要阶段。", "ans": "小康社会, 社会主义现代化国家"}, {"id": 59, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[59]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>是引领发展的第一动力——解决发展动力问题。", "ans": "创新"}, {"id": 60, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[60]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">协调</span></span>是持续健康发展的内在要求——解决发展不平衡问题。", "ans": "协调"}, {"id": 61, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[61]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">绿色</span></span>是永续发展的必要条件——解决人与自然和谐共生问题。", "ans": "绿色"}, {"id": 62, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[62]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">开放</span></span>是国家繁荣发展的必由之路——解决发展内外联动问题。", "ans": "开放"}, {"id": 63, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[63]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">共享</span></span>是中国特色社会主义的本质要求——解决社会公平正义问题。", "ans": "共享"}, {"id": 64, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[64]</span> 构建以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国内</span></span>循环为主体、国内国际双循环相互促进的新发展格局。", "ans": "国内"}, {"id": 65, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[65]</span> 构建新发展格局的基础支撑和内在要求是建设<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全国统一大</span></span>市场。", "ans": "全国统一大"}, {"id": 66, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[66]</span> 构建新发展格局的关键在于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">经济循环</span></span>的畅通无阻。", "ans": "经济循环"}, {"id": 67, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[67]</span> 构建新发展格局最本质特征是实现高水平的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自立自强</span></span>。", "ans": "自立自强"}, {"id": 68, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[68]</span> 党的十九届四中全会指出，中国特色社会主义基本经济制度是“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公有制</span></span>为主体、多种所有制经济共同发展，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">按劳分配</span></span>为主体、多种分配方式并存，社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>经济体制”。", "ans": "公有制, 按劳分配, 市场"}, {"id": 69, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[69]</span> 公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础：要毫不动摇<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">巩固</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">发展</span></span>公有制经济，毫不动摇<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">鼓励、支持、引导</span></span>非公有制经济发展。", "ans": "巩固, 发展, 鼓励、支持、引导"}, {"id": 70, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[70]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公有制</span></span>主体地位不能动摇，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国有</span></span>经济主导作用不能动摇。这是巩固党的执政地位、坚持社会主义制度的重要保证。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国有</span></span>企业是我们党执政兴国的重要支柱和依靠力量。", "ans": "公有制, 国有, 国有"}, {"id": 71, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[71]</span> 非公有制经济是国家税收的重要来源，是稳定经济的重要基础，是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">技术创新</span></span>的重要主体，是就业创业的重要领域，是金融发展的重要依托，是经济持续健康发展的重要力量。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民营</span></span>经济是非公有制经济的主要形式。", "ans": "技术创新, 民营"}, {"id": 72, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[72]</span> 在社会主义初级阶段，我国实行的是公有制为主体、多种所有制经济共同发展的所有制，这种<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">所有</span></span>制决定了我国在<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">分配</span></span>制度上要坚持按劳分配为主体、多种分配方式并存。", "ans": "所有, 分配"}, {"id": 73, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[73]</span> 坚持社会主义市场经济改革方向，核心问题是处理好<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>的关系，使<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>在资源配置中起决定性作用和更好发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>作用。", "ans": "政府, 市场, 市场, 政府"}, {"id": 74, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[74]</span> 要用好“看不见的手”和“看得见的手”，推动有效<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>和有为<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>更好结合，必须做到既“放得<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">活</span></span>”又“管得<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">好</span></span>”。", "ans": "市场, 政府, 活, 好"}, {"id": 75, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[75]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">农业强国</span></span>是社会主义现代化强国的根基，是新时代“三农”工作的总纲。", "ans": "农业强国"}, {"id": 76, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[76]</span> 实施<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">乡村振兴</span></span>战略，是新时代做好“三农”工作的总抓手。", "ans": "乡村振兴"}, {"id": 77, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[77]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">增加农民收入</span></span>是“三农”工作的中心任务。", "ans": "增加农民收入"}, {"id": 78, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[78]</span> 实施乡村振兴战略，必须把确保重要农产品特别是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">粮食</span></span>供给作为<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">首要</span></span>任务。", "ans": "粮食, 首要"}, {"id": 79, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[79]</span> 保障粮食和重要农产品稳定安全供给是建设农业强国的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">头等</span></span>大事。", "ans": "头等"}, {"id": 80, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[80]</span> 区域协调发展战略：推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">西部</span></span>大开发形成新格局，推动<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">东北</span></span>全面振兴取得新突破，促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">中部</span></span>地区加快崛起，鼓励<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">东部</span></span>地区加快推进现代化。", "ans": "西部, 东北, 中部, 东部"}, {"id": 81, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[81]</span> 区域重大战略：推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">京津冀</span></span>协同发展、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">长三角</span></span>一体化发展、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">粤港澳</span></span>大湾区建设，推动长江经济带发展、黄河流域生态保护和高质量发展。高标准、高质量建设雄安新区，推动成渝地区双城经济圈建设。", "ans": "京津冀, 长三角, 粤港澳"}, {"id": 82, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[82]</span> 主体功能区战略：逐步形成<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">城市化</span></span>地区、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">农产品</span></span>主产区、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">生态</span></span>功能区三大空间格局，并保持总体稳定。", "ans": "城市化, 农产品, 生态"}, {"id": 83, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[83]</span> 推进以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人</span></span>为核心的新型城镇化：推进以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">县城</span></span>为重要载体的城镇化建设。把推进农业转移人口<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市民化</span></span>作为新型城镇化首要任务。", "ans": "人, 县城, 市民化"}, {"id": 84, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[84]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民代表大会</span></span>制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。其实质是人民当家作主，一切权力属于人民。", "ans": "人民代表大会"}, {"id": 85, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[85]</span> （二）<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基本</span></span>政治制度", "ans": "基本"}, {"id": 86, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[86]</span> 内涵：共产党领导、多党派合作，共产党<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执</span></span>政、多党派<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">参</span></span>政。", "ans": "执, 参"}, {"id": 87, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[87]</span> 民族工作的主线：铸牢中华民族<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">共同体</span></span>意识。", "ans": "共同体"}, {"id": 88, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[88]</span> 地位：社会主义民主政治建设的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基础</span></span>，社会主义民主最广泛的实践。", "ans": "基础"}, {"id": 89, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[89]</span> 形式：<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">村民</span></span>委员会、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">居民</span></span>委员会。", "ans": "村民, 居民"}, {"id": 90, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[90]</span> 全过程人民民主实现了<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">过程</span></span>民主和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">成果</span></span>民主、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">程序</span></span>民主和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实质</span></span>民主、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">直接</span></span>民主和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">间接</span></span>民主、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民</span></span>民主和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国家</span></span>意志相统一。", "ans": "过程, 成果, 程序, 实质, 直接, 间接, 人民, 国家"}, {"id": 91, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[91]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民代表大会制度</span></span>是实现我国全过程人民民主的重要制度载体。", "ans": "人民代表大会制度"}, {"id": 92, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[92]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">协商</span></span>民主是实践全过程人民民主的重要形式。", "ans": "协商"}, {"id": 93, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[93]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基层</span></span>民主是全过程人民民主的重要体现。", "ans": "基层"}, {"id": 94, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[94]</span> 统战工作的本质要求是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">大团结大联合</span></span>，解决的就是人心和力量问题。", "ans": "大团结大联合"}, {"id": 95, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[95]</span> 统战工作的关键是要坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">求同存异</span></span>，发扬“团结—批评—团结”的优良传统，在尊重<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">多样性</span></span>中寻求<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">一致性</span></span>，找到最大公约数、画出最大同心圆。", "ans": "求同存异, 多样性, 一致性"}, {"id": 96, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[96]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党的领导</span></span>是统一战线最鲜明的特征，坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党的领导</span></span>是统一战线最核心最根本的问题。", "ans": "党的领导, 党的领导"}, {"id": 97, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[97]</span> 建设社会主义文化强国、推动社会主义文化繁荣兴盛，关键在于坚定中国特色社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">文化自信</span></span>。", "ans": "文化自信"}, {"id": 98, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[98]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>是我们立党立国、兴党兴国的根本指导思想，要坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">马克思主义</span></span>在意识形态领域指导地位的根本制度。", "ans": "马克思主义, 马克思主义"}, {"id": 99, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[99]</span> 坚持以社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">核心价值观</span></span>为引领，不断构筑中国精神、中国价值、中国力量。", "ans": "核心价值观"}, {"id": 100, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[100]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保护</span></span>第一、合理<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">利用</span></span>和最小干预原则，推动文化遗产系统性保护。", "ans": "保护, 利用"}, {"id": 101, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[101]</span> 坚持以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民</span></span>为中心的创作导向，坚持把<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社会</span></span>效益放在首位、社会效益和经济效益相统一，把激发创新创造活力作为深化文化体制机制改革的中心环节。", "ans": "人民, 社会"}, {"id": 102, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[102]</span> 就业是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">最基本</span></span>的民生，是最大的民生工程、民心工程、根基工程。", "ans": "最基本"}, {"id": 103, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[103]</span> 健全终身职业技能培训制度，推动解决<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">结构</span></span>性就业矛盾。", "ans": "结构"}, {"id": 104, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[104]</span> 收入分配是民生之<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">源</span></span>。分配制度是促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">共同富裕</span></span>的基础性制度。", "ans": "源, 共同富裕"}, {"id": 105, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[105]</span> 发挥初次分配的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基础</span></span>性作用，努力提高<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">劳动</span></span>报酬在初次分配中的比重，健全工资合理增长机制。", "ans": "基础, 劳动"}, {"id": 106, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[106]</span> 发挥再分配的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">调节</span></span>作用，加大税收、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社保</span></span>、转移支付等的调节力度。", "ans": "调节, 社保"}, {"id": 107, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[107]</span> 建立健全第三次分配机制，引导、支持有意愿有能力的企业、社会组织和个人积极参与<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益慈善</span></span>事业。", "ans": "公益慈善"}, {"id": 108, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[108]</span> 社会保障体系是人民生活的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">安全网</span></span>和社会运行的稳定器。", "ans": "安全网"}, {"id": 109, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[109]</span> 社会保障体系是由国家立法规定并以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国家</span></span>作为给付义务主体，为保障社会成员的基本生活和福利、对生活困难社会成员给予物质或服务帮助的各项措施的统称，主要涉及社会保险、社会福利、社会救助、社会优抚等方面。", "ans": "国家"}, {"id": 110, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[110]</span> 社会<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保险</span></span>是社会保障制度的主体和核心内容。", "ans": "保险"}, {"id": 111, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[111]</span> 社会<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">福利</span></span>属于最高层次的社会保障措施。", "ans": "福利"}, {"id": 112, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[112]</span> 社会<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">救助</span></span>属于最低层次的社会保障措施。", "ans": "救助"}, {"id": 113, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[113]</span> 完善基本养老保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">全国</span></span>统筹制度，推动基本医疗保险、失业保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">省级</span></span>统筹，完善工伤保险<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">省级</span></span>统筹。", "ans": "全国, 省级, 省级"}, {"id": 114, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[114]</span> 坚持基本医疗卫生事业<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公益</span></span>属性。", "ans": "公益"}, {"id": 115, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[115]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">预防</span></span>为主的方针，深入实施健康中国行动。", "ans": "预防"}, {"id": 116, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[116]</span> 共<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">建</span></span>要求突出制度和体系建设的基础性、战略性地位，是社会治理的基础；", "ans": "建"}, {"id": 117, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[117]</span> 共<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">治</span></span>要求树立大社会观、大治理观，打造全民参与的开放治理体系，是社会治理的关键；", "ans": "治"}, {"id": 118, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[118]</span> 共<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">享</span></span>要求社会治理的成效更多更公平惠及全体人民，是社会治理的目标。", "ans": "享"}, {"id": 119, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[119]</span> 坚持发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党委</span></span>领导核心作用、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>主导作用，发挥相关部门职能作用、社会各方面协同作用、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">广大群众</span></span>主体作用，形成社会治理整体合力。", "ans": "党委, 政府, 广大群众"}, {"id": 120, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[120]</span> 健全党组织领导的城乡基层治理体系，实现政府治理和社会调节、居民自治良性互动。充分发挥基层党组织<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">领导核心</span></span>作用，把党的领导贯穿社会治理全过程各环节。有效发挥基层政府<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主导</span></span>作用，健全社区管理和服务机制。注重发挥基层群众性自治组织<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基础</span></span>作用，促进基层群众自治与网格化服务管理有效衔接。", "ans": "领导核心, 主导, 基础"}, {"id": 121, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[121]</span> 尊重自然、顺应自然、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保护</span></span>自然是全面建设社会主义现代化国家的内在要求。 ", "ans": "保护"}, {"id": 122, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[122]</span> 坚持把<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">绿色低碳</span></span>发展作为解决生态环境问题的治本之策。", "ans": "绿色低碳"}, {"id": 123, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[123]</span> 坚持节约优先、保护优先、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自然恢复</span></span>为主的方针。", "ans": "自然恢复"}, {"id": 124, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[124]</span> 我国碳达峰碳中和的目标是 <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2030</span></span> 年前实现碳达峰、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">2060</span></span> 年前实现碳中和。", "ans": "2030, 2060"}, {"id": 125, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[125]</span> 构建以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国家公园</span></span>为主体、自然保护区为基础、各类自然公园为补充的自然保护地体系。", "ans": "国家公园"}, {"id": 126, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[126]</span> 党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十一届三中</span></span>全会开启了改革开放和社会主义现代化建设新时期。", "ans": "十一届三中"}, {"id": 127, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[127]</span> 改革开放的地位：重要法宝、关键一招、根本<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">动力</span></span>、必由之路。", "ans": "动力"}, {"id": 128, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[128]</span> 党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">十八届三中</span></span>全会开创了新时代全面深化改革新局面。", "ans": "十八届三中"}, {"id": 129, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[129]</span> 全面深化改革总目标是完善和发展中国特色社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>、推进国家<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">治理</span></span>体系和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">治理</span></span>能力现代化。", "ans": "制度, 治理, 治理"}, {"id": 130, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[130]</span> 全面深化改革开放必须以是否有利于坚持和改善<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党的全面领导</span></span>、是否有利于坚持和完善中国特色社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>为根本标准。", "ans": "党的全面领导, 制度"}, {"id": 131, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[131]</span> 改革和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">法治</span></span>如鸟之两翼、车之两轮，相辅相成、相伴而生。", "ans": "法治"}, {"id": 132, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[132]</span> 进一步全面深化改革以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>建设为主线，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">经济</span></span>体制改革为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点。", "ans": "制度, 经济"}, {"id": 133, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[133]</span> 全面依法治国是中国特色社会主义的本质要求和重要<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保障</span></span>。", "ans": "保障"}, {"id": 134, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[134]</span> 中国特色社会主义法治道路的核心要义，就是要坚持党的领导，坚持中国特色社会主义<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>，贯彻中国特色社会主义法治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">理论</span></span>。", "ans": "制度, 理论"}, {"id": 135, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[135]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党的领导</span></span>是社会主义法治最根本的保证，是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。", "ans": "党的领导"}, {"id": 136, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[136]</span> 全面依法治国的总目标是建设中国特色社会主义法治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">体系</span></span>、建设社会主义法治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国家</span></span>。", "ans": "体系, 国家"}, {"id": 137, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[137]</span> 全面依法治国的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">总抓手</span></span>是建设中国特色社会主义法治体系。", "ans": "总抓手"}, {"id": 138, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[138]</span> 坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政，坚持依宪治国、依宪执政，把全面贯彻<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">实施</span></span>宪法作为首要任务。", "ans": "实施"}, {"id": 139, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[139]</span> 法治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国家</span></span>是法治建设的目标。", "ans": "国家"}, {"id": 140, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[140]</span> 法治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">社会</span></span>是构筑法治国家的基础。", "ans": "社会"}, {"id": 141, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[141]</span> 法治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>建设是全面依法治国的重点任务和主体工程。", "ans": "政府"}, {"id": 142, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[142]</span> 全面推进科学<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">立法</span></span>、严格<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执法</span></span>、公正<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">司法</span></span>、全民<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">守法</span></span>。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">公正司法</span></span>是维护社会公平正义的最后一道防线。", "ans": "立法, 执法, 司法, 守法, 公正司法"}, {"id": 143, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[143]</span> 全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路，是新时代党的建设的鲜明<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主题</span></span>。", "ans": "主题"}, {"id": 144, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[144]</span> 坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强党的长期<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">执政</span></span>能力建设、先进性和纯洁性建设为<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主线</span></span>，以党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>建设为统领，以坚定<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">理想信念</span></span>宗旨为根基，以调动全党积极性、主动性、创造性为着力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量，把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。", "ans": "执政, 主线, 政治, 理想信念, 制度"}, {"id": 145, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[145]</span> 政治建设是党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">根本性</span></span>建设，决定着党的建设方向和效果，要摆在首位。", "ans": "根本性"}, {"id": 146, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[146]</span> 政治建设首要任务是保证全党服从中央，坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党中央</span></span>权威和集中统一领导。", "ans": "党中央"}, {"id": 147, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[147]</span> 思想建设是党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基础性</span></span>建设。", "ans": "基础性"}, {"id": 148, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[148]</span> 思想建设的首要任务是坚定<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">理想信念</span></span>。", "ans": "理想信念"}, {"id": 149, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[149]</span> 思想建设的根本任务是用党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新理论</span></span>武装全党。", "ans": "创新理论"}, {"id": 150, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[150]</span> 新时代党的组织路线，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">组织体系</span></span>建设为重点，建设忠诚干净担当的高素质干部队伍是关键。", "ans": "组织体系"}, {"id": 151, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[151]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">地方</span></span>党委是贯彻落实党中央决策部署的“中间段”。", "ans": "地方"}, {"id": 152, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[152]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基层</span></span>党组织是贯彻落实党中央决策部署的“最后一公里”。", "ans": "基层"}, {"id": 153, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[153]</span> 严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">两个维护</span></span>”。", "ans": "两个维护"}, {"id": 154, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[154]</span> 从严治党，关键是要抓住<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">领导</span></span>干部这个“关键少数”。", "ans": "领导"}, {"id": 155, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[155]</span> 作风问题的核心是保持党同<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民群众</span></span>的血肉联系。", "ans": "人民群众"}, {"id": 156, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[156]</span> 党的最大政治优势是密切联系群众，执政后的最大危险是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">脱离群众</span></span>。", "ans": "脱离群众"}, {"id": 157, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[157]</span> 要持续深化纠治<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">形式</span></span>主义、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">官僚</span></span>主义、享乐主义和奢靡之风。", "ans": "形式, 官僚"}, {"id": 158, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[158]</span> 加强纪律建设是全面从严治党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">治本</span></span>之策。", "ans": "治本"}, {"id": 159, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[159]</span> 从严治党要靠思想教育，也要靠制度保障，靠制度是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">长远</span></span>之策、根本之策。", "ans": "长远"}, {"id": 160, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[160]</span> 要坚持以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党章</span></span>为根本，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">民主集中制</span></span>为核心，完善党内法规制度体系。", "ans": "党章, 民主集中制"}, {"id": 161, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[161]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党内</span></span>监督是永葆党的肌体健康的生命之源，在党和国家各种监督形式中是最根本的、第一位的。", "ans": "党内"}, {"id": 162, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[162]</span> 腐败是党长期执政面临的最大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">威胁</span></span>，反腐败是最彻底的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自我革命</span></span>。", "ans": "威胁, 自我革命"}, {"id": 163, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[163]</span> 反腐倡廉的核心是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>制约和监督权力。", "ans": "制度"}, {"id": 164, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[164]</span> 坚持不敢腐、不能腐、不想腐一体推进。把<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不敢</span></span>腐的强大震慑效能、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不能</span></span>腐的刚性制度约束、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">不想</span></span>腐的思想教育优势融于一体。", "ans": "不敢, 不能, 不想"}, {"id": 165, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[165]</span> 党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自我革命</span></span>是跳出历史周期率的第二个答案。勇于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自我革命</span></span>，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格。", "ans": "自我革命, 自我革命"}, {"id": 166, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[166]</span> 总体国家安全观是总体的、系统的、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">相对</span></span>的大安全。以国家利益为准则，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>安全为根本，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">经济</span></span>安全为基础，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民</span></span>安全为宗旨，以军事、科技、文化、社会安全为保障，以促进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国际</span></span>安全为依托。", "ans": "相对, 政治, 经济, 人民, 国际"}, {"id": 167, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[167]</span> 总体国家安全观的关键和灵魂是“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">总体</span></span>”，它突出大安全理念。", "ans": "总体"}, {"id": 168, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[168]</span> 坚持把<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>安全摆在首位，这是新时代中国国家安全的生命线。", "ans": "政治"}, {"id": 169, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[169]</span> 践行<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人民</span></span>安全宗旨，这是新时代中国国家安全的根本立场。", "ans": "人民"}, {"id": 170, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[170]</span> 教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">支撑</span></span>。必须坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>是第一生产力、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">人才</span></span>是第一资源、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>是第一动力，加快教育强国、科技强国、人才强国建设。", "ans": "支撑, 科技, 人才, 创新"}, {"id": 171, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[171]</span> 建设教育强国是全面推进强国建设、民族复兴伟业的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">先导</span></span>任务、坚实基础、战略支撑。", "ans": "先导"}, {"id": 172, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[172]</span> 必须以坚持党对教育事业的全面领导为根本<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">保证</span></span>，以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">立德树人</span></span>为根本任务，以为党育人、为国育才为根本目标。", "ans": "保证, 立德树人"}, {"id": 173, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[173]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">高质量</span></span>发展是教育的生命线。要把<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基础</span></span>教育作为基点，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">高等</span></span>教育作为龙头。", "ans": "高质量, 基础, 高等"}, {"id": 174, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[174]</span> 实现高水平科技<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自立自强</span></span>是国家强盛和民族复兴的战略基石。", "ans": "自立自强"}, {"id": 175, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[175]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基础</span></span>研究是科技创新的源头，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">应用</span></span>研究是基础研究转化为实际应用的桥梁。", "ans": "基础, 应用"}, {"id": 176, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[176]</span> 加大研发投入，健全<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政府</span></span>投入为主、社会多渠道投入机制。", "ans": "政府"}, {"id": 177, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[177]</span> 强化基础研究前瞻性、战略性、系统性布局，坚持目标导向和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自由探索</span></span>“两条腿走路”，有组织推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">战略</span></span>导向的体系化基础研究、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">前沿</span></span>导向的探索性基础研究、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">市场</span></span>导向的应用性基础研究，把握科技发展大趋势，下好自主创新先手棋。", "ans": "自由探索, 战略, 前沿, 市场"}, {"id": 178, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[178]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国家实验室</span></span>要发挥引领作用，多出战略性、关键性重大科技成果。", "ans": "国家实验室"}, {"id": 179, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[179]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">国家科研机构</span></span>要发挥建制化组织作用，加快建设原始创新策源地。", "ans": "国家科研机构"}, {"id": 180, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[180]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">高水平研究型大学</span></span>是基础研究的主力军和重大科技突破的生力军。", "ans": "高水平研究型大学"}, {"id": 181, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[181]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">企业</span></span>是科技创新的主体。", "ans": "企业"}, {"id": 182, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[182]</span> 人才是实现民族振兴、赢得国际竞争主动的战略<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">资源</span></span>。", "ans": "资源"}, {"id": 183, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[183]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党</span></span>对人才工作的全面领导，是我国人才体系的鲜明政治优势，也是建设人才强国的“纲”和“本”。", "ans": "党"}, {"id": 184, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[184]</span> 走好人才<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">自主培养</span></span>之路，满足庞大的人才需求必须主要依靠自己培养。", "ans": "自主培养"}, {"id": 185, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[185]</span> 改进人才评价机制，建立健全以<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">创新</span></span>能力、质量、实效、贡献为导向的评价体系。", "ans": "创新"}, {"id": 186, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[186]</span> 习近平党建思想丰富和发展了马克思主义建党学说，是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合推进党的理论创新的重大成果，是党和人民实践经验和集体智慧的结晶，是习近平新时代中国特色社会主义思想的重要组成部分，为深入推进新时代党的建设新的伟大<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">工程</span></span>提供了根本遵循和行动指南。", "ans": "工程"}, {"id": 187, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[187]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">党的领导</span></span>是中国特色社会主义最本质的特征；", "ans": "党的领导"}, {"id": 188, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[188]</span> 坚持不忘<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">初心</span></span>、牢记<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">使命</span></span>是党的宗旨立场和价值取向；", "ans": "初心, 使命"}, {"id": 189, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[189]</span> 坚持以党的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>建设为统领是新时代党的建设的根本要求；", "ans": "政治"}, {"id": 190, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[190]</span> 坚持用党的创新理论凝心铸魂是党的思想建设的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">根本</span></span>任务；", "ans": "根本"}, {"id": 191, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[191]</span> 坚持健全上下贯通、执行有力的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">组织</span></span>体系是党的优势所在、力量所在；", "ans": "组织"}, {"id": 192, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[192]</span> 坚持建设堪当民族复兴重任的高素质<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">干部</span></span>队伍是关系党和国家事业的关键性问题；", "ans": "干部"}, {"id": 193, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[193]</span> 坚持推进<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">作风</span></span>建设常态化长效化是保持党同人民群众血肉联系的有效途径；", "ans": "作风"}, {"id": 194, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[194]</span> 坚持用严明的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">纪律</span></span>管全党治全党是全面从严治党的治本之策；", "ans": "纪律"}, {"id": 195, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[195]</span> 坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">制度</span></span>治党、依规治党是全面从严治党的长远和根本之策；", "ans": "制度"}, {"id": 196, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[196]</span> 习近平党建思想是对新时代全面<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">从严治党</span></span>实践经验的概括和凝练；习近平党建思想是对马克思主义建党学说的继承和发展；习近平党建思想是对中华优秀传统文化的传承和转化；习近平党建思想是对马克思主义政党经验教训的总结和镜鉴。", "ans": "从严治党"}, {"id": 197, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[197]</span> 未来产业具有<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">前瞻性</span></span>、战略性、颠覆性等特点，需要科学谋划、全局统筹。要综合考虑国家战略需求、技术成熟程度、要素支撑条件等因素，因地制宜、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">错位发展</span></span>。", "ans": "前瞻性, 错位发展"}, {"id": 198, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[198]</span> 要充分发挥新型举国体制优势，坚持“<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">产业</span></span>出题、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>答题”，加大重点领域关键核心技术攻关力度，加强<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">基础</span></span>研究战略性、前瞻性、体系化布局，加快科技成果转化应用。", "ans": "产业, 科技, 基础"}, {"id": 199, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[199]</span> 要发挥<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">企业</span></span>主体作用，推动各类创新资源向企业集聚，大力培育核心技术领先、创新能力强的科技领军企业和高新技术企业，引领带动产业向前沿和高端领域迈进。", "ans": "企业"}, {"id": 200, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[200]</span> 要完善财税等政策，大力发展<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">科技</span></span>金融，全方位做好人才培养、引进、使用工作，在全社会营造鼓励创新的浓厚氛围。", "ans": "科技"}, {"id": 201, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[201]</span> 要统筹发展和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">安全</span></span>，探索科学有效的监管方式，防范相关风险，确保既“放得活”又“管得好”。要深化国际合作，积极推动各方标准共建、规则共商、产业共促。", "ans": "安全"}, {"id": 202, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[202]</span> 要站在统筹高质量发展和高水平安全的战略高度，充分认识做好防灾减灾救灾工作的重要性。做好防灾减灾救灾工作必须坚持党的全面领导，坚持人民至上、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">生命</span></span>至上，坚持尊重自然规律，坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">预防</span></span>为主，坚持改革创新，坚持系统观念，坚持社会共治。", "ans": "生命, 预防"}, {"id": 203, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[203]</span> 降低灾害风险，减轻灾害损失，重在事前<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">预防</span></span>。要坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">源头</span></span>管控，将安全韧性要求贯穿国土空间规划及各类建设规划之中。强化工程治理，合理提高重要城市和灾害多发地区关键基础设施设防标准，加紧补齐相关短板。要树牢<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">底线</span></span>思维、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">极限</span></span>思维，不断提升大灾巨灾应对处置能力。健全大安全大应急框架下应急指挥机制，推进国家综合性消防救援队伍和国家区域应急救援中心建设。", "ans": "预防, 源头, 底线, 极限"}, {"id": 204, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[204]</span> 基层是抵御自然灾害的第一线，抓基层、强基础的工作始终不能放松。要完善基层应急救援力量体系，强化应急场所建设和物资装备保障，抓好群测群防群治。各地区各有关部门要守土尽责，坚持统分结合、<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">防救</span></span>衔接、上下联动，推动形成齐抓共管、协同配合的工作格局。树立和践行正确政绩观，坚决纠正重发展轻安全、重救灾轻预防等倾向。", "ans": "防救"}, {"id": 205, "cat": "习思想", "html": "<span style=\"color:#6366f1; font-weight:bold;\">[205]</span> 高质量推进国防和军队现代化，是推进中国式现代化的应有之义。“十五五”时期，要深入贯彻新时代强军思想，强化<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">政治</span></span>引领，推动基本实现国防和军队现代化取得<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">决定性</span></span>进展。", "ans": "政治, 决定性"}, {"id": 206, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[206]</span> 物质的唯一特性是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">客观实在性</span></span>。", "ans": "客观实在性"}, {"id": 207, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[207]</span> 物质的根本属性和存在方式是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">运动</span></span>。", "ans": "运动"}, {"id": 208, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[208]</span> 世界上的事物都是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">绝对</span></span>运动和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">相对</span></span>静止的统一。", "ans": "绝对, 相对"}, {"id": 209, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[209]</span> 意识的本质是人脑对客观存在的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主观映象</span></span>。", "ans": "主观映象"}, {"id": 210, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[210]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">物质</span></span>决定<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">意识</span></span>，要求一切从实际出发。", "ans": "物质, 意识"}, {"id": 211, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[211]</span> 意识具有<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">主观能动性</span></span>，对物质起能动的反作用。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">正确</span></span>的意识对事物的发展具有促进作用，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">错误</span></span>的意识对事物的发展具有阻碍作用。", "ans": "主观能动性, 正确, 错误"}, {"id": 212, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[212]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">尊重客观规律</span></span>是正确发挥主观能动性的前提。", "ans": "尊重客观规律"}, {"id": 213, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[213]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">联系</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">发展</span></span>的观点是唯物辩证法的总观点和总特征。", "ans": "联系, 发展"}, {"id": 214, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[214]</span> （1）联系的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">客观性</span></span>", "ans": "客观性"}, {"id": 215, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[215]</span> （2）联系的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">普遍性</span></span>", "ans": "普遍性"}, {"id": 216, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[216]</span> 部分<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">影响</span></span>整体，<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">关键</span></span>部分的功能及其变化甚至决定整体的功能。", "ans": "影响, 关键"}, {"id": 217, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[217]</span> 发展的实质是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">新事物</span></span>的产生和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">旧事物</span></span>的灭亡。", "ans": "新事物, 旧事物"}, {"id": 218, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[218]</span> 一、对立统一规律：揭示了事物发展的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">源泉</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">动力</span></span>", "ans": "源泉, 动力"}, {"id": 219, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[219]</span> 矛盾的基本属性：矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">同一性</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">斗争性</span></span>", "ans": "同一性, 斗争性"}, {"id": 220, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[220]</span> 矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">同一性</span></span>是指矛盾双方相互依存、相互贯通的性质和趋势。", "ans": "同一性"}, {"id": 221, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[221]</span> 矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">斗争性</span></span>是指矛盾双方相互排斥、相互分离的性质和趋势。", "ans": "斗争性"}, {"id": 222, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[222]</span> （1）矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">普遍</span></span>性", "ans": "普遍"}, {"id": 223, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[223]</span> 方法论：坚持<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">矛盾分析法</span></span>，全面地看问题，一分为二地看问题。", "ans": "矛盾分析法"}, {"id": 224, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[224]</span> （2）矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">特殊</span></span>性", "ans": "特殊"}, {"id": 225, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[225]</span> 原理：具体事物的矛盾及每一矛盾的不同方面各有其特点。矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">特殊性</span></span>规定了一事物区别于其他事物的本质", "ans": "特殊性"}, {"id": 226, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[226]</span> 方法论：做到<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">具体问题具体分析</span></span>。", "ans": "具体问题具体分析"}, {"id": 227, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[227]</span> 矛盾的普遍性即矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">共性</span></span>，矛盾的特殊性即矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">个性</span></span>。矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">共性</span></span>是无条件的、绝对的，矛盾的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">个性</span></span>是有条件的、相对的。", "ans": "共性, 个性, 共性, 个性"}, {"id": 228, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[228]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">普遍性</span></span>寓于<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">特殊性</span></span>之中，特殊性又都是包含着普遍性的特殊性。", "ans": "普遍性, 特殊性"}, {"id": 229, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[229]</span> 主要方面：居于支配地位的方面。事物的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">性质</span></span>由主要矛盾的主要方面决定。次要方面：处于被支配地位的方面。", "ans": "性质"}, {"id": 230, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[230]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">两点论</span></span>就是全面论。在研究复杂事物的发展过程时，既要看到主要矛盾，又要看到次要矛盾；在研究某一矛盾时，既要看到矛盾的主要方面，又要看到矛盾的次要方面。", "ans": "两点论"}, {"id": 231, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[231]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">重点论</span></span>就是分清矛盾主次抓重点。要求在研究复杂事物的发展过程时，要着重地把握它的主要矛盾；在分析某一矛盾时，要着重地把握它的主要方面。", "ans": "重点论"}, {"id": 232, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[232]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内因</span></span>是事物发展变化的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">根据</span></span>，是第一位的原因。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">外因</span></span>是事物发展变化的条件，是第二位的原因。<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">外因</span></span>通过<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">内因</span></span>而起作用。", "ans": "内因, 根据, 外因, 外因, 内因"}, {"id": 233, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[233]</span> 二、量变质变规律：揭示了事物发展的<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">形式</span></span>和<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">状态</span></span>", "ans": "形式, 状态"}, {"id": 234, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[234]</span> 区分量变和质变的根本标志是事物变化是否超出<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">度</span></span>的范围。", "ans": "度"}, {"id": 235, "cat": "马哲", "html": "<span style=\"color:#10b981; font-weight:bold;\">[235]</span> <span class=\"blank-space\"><span class=\"ans-span answer-hidden\">量变</span></span>是<span class=\"blank-space\"><span class=\"ans-span answer-hidden\">质变</span></span>的必要准备。", "ans": "量变, 质变"}, {"id": 236, "cat": "马哲", "html": "<span
